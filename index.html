<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sports Stream Hub</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="StreamHub">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #2563eb;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 30px;
        }

        header {
            background-color: var(--card-bg);
            padding: 16px;
            text-align: center;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .category-bar {
            display: flex;
            overflow-x: auto;
            padding: 12px 16px;
            gap: 10px;
            background-color: var(--bg-color);
            scrollbar-width: none;
        }

        .category-bar::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid #334155;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
            cursor: pointer;
        }

        .cat-btn.active {
            background-color: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
        }

        .container {
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-right: 12px;
        }

        .card-title {
            font-weight: 600;
            font-size: 0.95rem;
            line-height: 1.3;
        }

        .card-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .watch-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            white-space: nowrap;
            cursor: pointer;
        }

        /* Embedded Player Window */
        #player-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background-color: var(--card-bg);
            border-bottom: 1px solid #334155;
        }

        .close-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Sports Stream Hub</h1>
    </header>

    <div class="category-bar">
        <button class="cat-btn active" onclick="selectCategory('NFL', this)">NFL</button>
        <button class="cat-btn" onclick="selectCategory('CFB', this)">CFB</button>
        <button class="cat-btn" onclick="selectCategory('MLB', this)">MLB</button>
        <button class="cat-btn" onclick="selectCategory('MMA', this)">MMA/UFC</button>
        <button class="cat-btn" onclick="selectCategory('NBA', this)">NBA</button>
    </div>

    <div class="container">
        <div id="game-list"></div>
    </div>

    <!-- Fullscreen Stream Container -->
    <div id="player-modal">
        <div class="modal-header">
            <span id="modal-title" style="font-weight: 600;">Stream View</span>
            <button class="close-btn" onclick="closeStream()">✕ Close Stream</button>
        </div>
        <iframe id="stream-frame" src="" allowfullscreen></iframe>
    </div>

    <script>
        const scheduleData = {
            NFL: [
                { title: "Los Angeles Rams vs San Francisco 49ers", sub: "NFL Stream Feed", url: "https://mybuffstreams.plus/nfl" },
                { title: "NFL Network Live 24/7", sub: "Official Feed", url: "https://mybuffstreams.plus/nfl" }
            ],
            CFB: [
                { title: "NCAA Football Live Games Hub", sub: "CFB Saturday Coverage", url: "https://mybuffstreams.plus/football" }
            ],
            MLB: [
                { title: "New York Yankees vs Colorado Rockies", sub: "MLB Broadcast", url: "https://mybuffstreams.plus/mlb" },
                { title: "Chicago White Sox vs Pittsburgh Pirates", sub: "MLB Broadcast", url: "https://mybuffstreams.plus/mlb" }
            ],
            MMA: [
                { title: "UFC Fight Night Pass", sub: "MMA Main Event & Prelims", url: "https://mybuffstreams.plus/mma" }
            ],
            NBA: [
                { title: "NBA Stream Hub", sub: "Active Basketball Schedule", url: "https://mybuffstreams.plus/nba" }
            ]
        };

        function selectCategory(catKey, btnElement) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');

            const container = document.getElementById('game-list');
            container.innerHTML = '';

            scheduleData[catKey].forEach(game => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-info">
                        <span class="card-title">${game.title}</span>
                        <span class="card-sub">${game.sub}</span>
                    </div>
                    <button onclick="openStream('${game.url}', '${game.title}')" class="watch-btn">Watch Inside App</button>
                `;
                container.appendChild(card);
            });
        }

        function openStream(url, title) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('stream-frame').src = url;
            document.getElementById('player-modal').style.display = 'flex';
        }

        function closeStream() {
            document.getElementById('player-modal').style.display = 'none';
            document.getElementById('stream-frame').src = '';
        }

        // Initialize default tab
        selectCategory('NFL', document.querySelector('.cat-btn'));
    </script>
</body>
</html>
