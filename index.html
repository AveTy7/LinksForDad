<!DOCTYPE html>
<html lang="en" class="dark skin-midnight">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sports Schedule Hub (MST)</title>
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --accent: #2563eb; --text: #f8fafc; --muted: #94a3b8; --border: #334155; --live: #22c55e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 16px; padding-bottom: 40px; }
        header { text-align: center; margin-bottom: 16px; }
        .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 12px; }
        .tab-btn { background: var(--card); color: var(--muted); border: 1px solid var(--border); padding: 8px 16px; border-radius: 20px; font-weight: 600; cursor: pointer; }
        .tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .loading { text-align: center; color: var(--muted); padding: 40px; }
        textarea { width: 100%; height: 150px; background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 8px; font-family: monospace; font-size: 0.75rem; margin-bottom: 10px; }
        .parse-btn { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .raw-code-box { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; font-family: monospace; font-size: 0.75rem; white-space: pre-wrap; color: #cbd5e1; max-height: 500px; overflow-y: auto; }
    </style>
</head>
<body>

    <header>
        <h2>Sports Schedule Hub</h2>
        <p style="color: var(--muted); font-size: 0.8rem;">Live & Upcoming Games • Times in MST</p>
    </header>

    <div class="tabs" id="tab-bar"></div>
    <div id="game-list" class="loading">Loading schedule...</div>

    <script>
        const LEAGUES = {
            "MLB": "baseball/mlb",
            "NFL": "football/nfl",
            "CFB": "football/college-football",
            "CBB": "basketball/mens-college-basketball",
            "Test": "test"
        };

        let activeLeague = "NFL";

        function initTabs() {
            const tabBar = document.getElementById('tab-bar');
            tabBar.innerHTML = '';
            Object.keys(LEAGUES).forEach(league => {
                const btn = document.createElement('button');
                btn.className = `tab-btn ${league === activeLeague ? 'active' : ''}`;
                btn.innerText = league;
                btn.onclick = () => switchTab(league, btn);
                tabBar.appendChild(btn);
            });
            fetchLeagueData(activeLeague);
        }

        function switchTab(league, btn) {
            activeLeague = league;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            fetchLeagueData(league);
        }

        async function fetchLeagueData(league) {
            const container = document.getElementById('game-list');
            
            if (league === "Test") {
                container.className = "";
                container.innerHTML = `
                    <p style="margin-bottom: 8px; font-size: 0.85rem; color: var(--muted);">Paste the webpage HTML source code below:</p>
                    <textarea id="html-input" placeholder="Paste source code here..."></textarea>
                    <button class="parse-btn" onclick="parseTestHtml()">Extract from &lt;ul class=&quot;competitions&quot;&gt;</button>
                    <div id="parse-output" style="margin-top: 16px;"></div>
                `;
                return;
            }

            container.className = "loading";
            container.innerHTML = "Fetching schedule...";

            try {
                const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${LEAGUES[league]}/scoreboard?limit=100`);
                const data = await res.json();
                
                container.innerHTML = data.events.map(e => {
                    const comp = e.competitions[0];
                    const home = comp.competitors.find(c => c.homeAway === 'home')?.team?.displayName || 'TBD';
                    const away = comp.competitors.find(c => c.homeAway === 'away')?.team?.displayName || 'TBD';
                    return `<div class="card"><span>${away}</span> <span>vs</span> <span>${home}</span></div>`;
                }).join('');
            } catch (err) {
                container.innerHTML = "<p class='loading'>Failed to load data.</p>";
            }
        }

        function parseTestHtml() {
            const rawHtml = document.getElementById('html-input').value;
            const targetMarker = '<ul class="competitions">';
            const startIndex = rawHtml.indexOf(targetMarker);
            const outputContainer = document.getElementById('parse-output');

            if (startIndex !== -1) {
                const extractedHtml = rawHtml.substring(startIndex);
                const escaped = extractedHtml.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                outputContainer.innerHTML = `<div class="raw-code-box">${escaped}</div>`;
            } else {
                outputContainer.innerHTML = `<p style="color: #f87171;">Could not find &lt;ul class="competitions"&gt; in the pasted code.</p>`;
            }
        }

        initTabs();
    </script>
</body>
</html>
