<!DOCTYPE html>
<html lang="en" class="dark skin-midnight">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Schedule Hub (MST)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0b0f19;
            --card: #131d31;
            --accent: #2563eb;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #1e293b;
            --live: #22c55e;
            --stream: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 16px; max-width: 600px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 16px; }
        header h2 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.5px; }
        header p { color: var(--muted); font-size: 0.75rem; margin-top: 2px; }

        .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; }
        
        .tab-btn {
            background: var(--card); color: var(--muted); border: 1px solid var(--border);
            padding: 6px 14px; border-radius: 16px; font-size: 0.8rem; font-weight: 600; white-space: nowrap; cursor: pointer;
        }
        .tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

        .filter-container {
            margin-bottom: 12px; display: none; align-items: center; justify-content: space-between;
            background: var(--card); padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
        }
        .filter-label { font-size: 0.8rem; color: var(--muted); font-weight: 600; }
        .conference-select {
            background: var(--bg); color: var(--text); border: 1px solid var(--border);
            padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; outline: none; max-width: 60%;
        }

        .top-action-bar {
            background: var(--card); border: 1px solid var(--border); border-radius: 10px;
            padding: 10px; margin-bottom: 12px;
        }
        .top-action-btn {
            background: var(--accent); color: white; border: none; width: 100%;
            padding: 10px; border-radius: 8px; font-size: 0.85rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
        }
        .top-action-btn:hover { filter: brightness(1.1); }

        .subpage-container {
            background: var(--card); border: 1px solid var(--border); border-radius: 10px;
            padding: 12px; margin-bottom: 12px; display: none;
        }
        .subpage-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
            border-bottom: 1px solid var(--border); padding-bottom: 8px;
        }
        .subpage-title { font-size: 0.85rem; font-weight: 700; color: #60a5fa; display: flex; align-items: center; gap: 6px; }
        .close-subpage-btn {
            background: var(--border); color: var(--text); border: none; padding: 4px 10px;
            border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer;
        }
        .close-subpage-btn:hover { background: #334155; }

        .standings-iframe-wrap {
            position: relative; width: 100%; height: 450px; border-radius: 8px; overflow: hidden; background: #fff;
        }
        .standings-iframe-wrap iframe { width: 100%; height: 100%; border: none; }

        .champions-grid { display: flex; flex-direction: column; gap: 6px; max-height: 440px; overflow-y: auto; padding-right: 2px; }
        .champions-grid::-webkit-scrollbar { width: 4px; }
        .champions-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .weight-class-row {
            display: flex; justify-content: space-between; padding: 8px 10px; border-bottom: 1px solid var(--border);
            font-size: 0.78rem; align-items: center; background: var(--bg); border-radius: 6px;
        }
        .weight-name { font-weight: 700; color: #60a5fa; width: 35%; }
        .weight-champs { width: 65%; text-align: right; font-weight: 600; color: var(--text); }

        /* Clean UFC Accordion */
        .ufc-div-card {
            background: var(--bg); border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
        }
        .ufc-div-header {
            padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer;
        }
        .ufc-div-header:hover { background: rgba(37, 99, 235, 0.08); }
        .ufc-div-title { font-size: 0.8rem; font-weight: 700; color: var(--text); }
        .ufc-champ-preview { font-size: 0.75rem; color: #f59e0b; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        
        .ufc-rankings-body {
            display: none; padding: 8px 12px; border-top: 1px solid var(--border); background: rgba(15, 23, 42, 0.5);
        }
        .ufc-div-card.expanded .ufc-rankings-body { display: block; }
        .ufc-rank-row {
            display: flex; justify-content: space-between; padding: 4px 0; font-size: 0.75rem; border-bottom: 1px solid rgba(30, 41, 59, 0.5);
        }
        .ufc-rank-row:last-child { border-bottom: none; }
        .rank-num { color: var(--muted); font-weight: 700; width: 30px; }
        .rank-name { flex: 1; font-weight: 600; text-align: right; }

        .card {
            background: var(--card); border: 1px solid var(--border); border-radius: 10px;
            padding: 10px 14px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 6px;
        }
        .card-main { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        
        .team { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
        .team.away { justify-content: flex-end; text-align: right; }
        .team img { width: 24px; height: 24px; object-fit: contain; flex-shrink: 0; }
        
        .team-text-stack { display: flex; flex-direction: column; min-width: 0; }
        .team.away .team-text-stack { align-items: flex-end; }
        .team.home .team-text-stack { align-items: flex-start; }
        
        .team-city { font-size: 0.55rem; color: var(--muted); font-weight: 600; text-transform: uppercase; }
        .team-name { font-size: 0.75rem; font-weight: 700; line-height: 1.1; }
        
        .info { text-align: center; padding: 0 4px; min-width: 85px; flex-shrink: 0; }
        .time { color: #60a5fa; font-weight: 600; font-size: 0.6rem; }
        .status { color: var(--muted); font-size: 0.55rem; font-weight: 600; }
        .status.live { color: var(--live); font-weight: 700; }
        
        .stream-link-container {
            border-top: 1px solid var(--border); padding-top: 6px; display: flex; flex-wrap: gap; gap: 6px;
        }
        .stream-btn {
            background: var(--stream); color: white; text-decoration: none;
            padding: 3px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 700;
            display: inline-flex; align-items: center; gap: 4px;
        }
        .stream-btn:hover { filter: brightness(1.1); }

        #game-list { min-height: 150px; }
        .loading { text-align: center; color: var(--muted); padding: 30px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <header>
        <h2>Sports Schedule Hub</h2>
        <p>Live & Upcoming Games • Times in MST</p>
    </header>

    <div class="tabs" id="tab-bar"></div>

    <div class="filter-container" id="filter-bar">
        <span class="filter-label">Conference:</span>
        <select class="conference-select" id="conf-select" onchange="filterByConference()">
            <option value="ALL">All Conferences</option>
        </select>
    </div>

    <div id="game-list" class="loading">Loading schedule...</div>

    <script>
        const LEAGUES = {
            "NFL": { endpoint: "football/nfl", type: "espn", standingsUrl: "https://www.espn.com/nfl/standings" },
            "NBA": { type: "scraped", category: "NBA", standingsUrl: "https://www.espn.com/nba/standings" },
            "MLB": { endpoint: "baseball/mlb", type: "espn", standingsUrl: "https://www.espn.com/mlb/standings" },
            "CFB": { endpoint: "football/college-football", type: "espn", standingsUrl: "https://www.espn.com/college-football/standings" },
            "CBB": { endpoint: "basketball/mens-college-basketball", type: "espn", standingsUrl: "https://www.espn.com/mens-college-basketball/standings" },
            "MMA": { type: "scraped", category: "MMA", isUfcRankings: true },
            "Boxing": { type: "scraped", category: "Boxing", isBoxing: true }
        };

        const BOXING_CHAMPIONS = [
            { weight: "Heavyweight", champions: "Oleksandr Usyk, Filip Hrgović" },
            { weight: "Cruiserweight", champions: "David Benavidez" },
            { weight: "Light Heavyweight", champions: "Artur Beterbiev" },
            { weight: "Super Middleweight", champions: "Saúl 'Canelo' Álvarez" },
            { weight: "Middleweight", champions: "Erislandy Lara, Janibek Alimkhanuly" },
            { weight: "Welterweight", champions: "Jaron Ennis" },
            { weight: "Lightweight", champions: "Gervonta Davis, Shakur Stevenson" },
            { weight: "Featherweight", champions: "Rafael Espinoza, Brandon Figueroa" }
        ];

        const UFC_FULL_RANKINGS = [
            { weight: "Heavyweight", champion: "Tom Aspinall", rankings: ["Ciryl Gane", "Alexander Volkov", "Sergei Pavlovich", "Curtis Blaydes", "Waldo Cortes Acosta", "Serghei Spivac", "Derrick Lewis", "Marcin Tybura", "Jairzinho Rozenstruik", "Alexander Romanov"] },
            { weight: "Light Heavyweight", champion: "Carlos Ulberg", rankings: ["Magomed Ankalaev", "Jiří Procházka", "Alex Pereira", "Khalil Rountree Jr.", "Paulo Costa", "Jamahal Hill", "Azamat Murzakanov", "Jan Błachowicz", "Volkan Oezdemir", "Aleksandar Rakić"] },
            { weight: "Middleweight", champion: "Sean Strickland", rankings: ["Khamzat Chimaev", "Dricus Du Plessis", "Nassourdine Imavov", "Brendan Allen", "Israel Adesanya", "Anthony Hernandez", "Caio Borralho", "Robert Whittaker", "Roman Dolidze", "Jared Cannonier"] },
            { weight: "Welterweight", champion: "Islam Makhachev", rankings: ["Carlos Prates", "Ian Machado Garry", "Michael Morales", "Jack Della Maddalena", "Sean Brady", "Gabriel Bonfim", "Belal Muhammad", "Leon Edwards", "Gilbert Burns", "Geoff Neal"] },
            { weight: "Lightweight", champion: "Justin Gaethje", rankings: ["Ilia Topuria", "Arman Tsarukyan", "Charles Oliveira", "Max Holloway", "Benoît Saint Denis", "Mateusz Gamrot", "Renato Moicano", "Paddy Pimblett", "Dan Hooker", "Jalin Turner"] },
            { weight: "Featherweight", champion: "Alexander Volkanovski", rankings: ["Movsar Evloev", "Diego Lopes", "Lerone Murphy", "Aljamain Sterling", "Arnold Allen", "Jean Silva", "Pat Sabatini", "Youssef Zalal", "Giga Chikadze", "Calvin Kattar"] },
            { weight: "Bantamweight", champion: "Petr Yan", rankings: ["Merab Dvalishvili", "Umar Nurmagomedov", "Sean O'Malley", "Cory Sandhagen", "Mario Bautista", "Song Yadong", "David Martinez", "Deiveson Figueiredo", "Rob Font", "Kyler Phillips"] },
            { weight: "Flyweight", champion: "Joshua Van", rankings: ["Alexandre Pantoja", "Manel Kape", "Tatsuro Taira", "Brandon Royval", "Lone'er Kavanagh", "Asu Almabayev", "Kyoji Horiguchi", "Brandon Moreno", "Tim Elliott", "Amir Albazi"] },
            { weight: "Women's Bantamweight", champion: "Kayla Harrison", rankings: ["Joselyne Edwards", "Norma Dumont", "Luana Santos", "Julianna Peña", "Ailin Perez", "Yana Santos", "Jacqueline Cavalcanti", "Raquel Pennington", "Miesha Tate", "Pannie Kianzad"] },
            { weight: "Women's Flyweight", champion: "Valentina Shevchenko", rankings: ["Natalia Silva", "Manon Fiorot", "Alexa Grasso", "Erin Blanchfield", "Zhang Weili", "Jasmine Jasudavicius", "Rose Namajunas", "Maycee Barber", "Karine Silva", "Tracy Cortez"] },
            { weight: "Women's Strawweight", champion: "Mackenzie Dern", rankings: ["Zhang Weili", "Tatiana Suarez", "Virna Jandiroba", "Denise Gomes", "Amanda Lemos", "Luana Pinheiro", "Loopy Godinez", "Tabatha Ricci", "Jessica Andrade", "Piera Rodriguez"] }
        ];

        const CFB_MAP = {
            "1": "ACC", "4": "Big 12", "8": "SEC", "9": "Big Ten", "12": "Pac-12",
            "15": "Conference USA", "17": "MAC", "18": "MWC", "37": "Sun Belt", 
            "151": "American Athletic", "80": "FBS Independents", "81": "FCS"
        };

        let activeLeague = "NFL";
        const cache = {};
        let currentGames = [];
        let globalLinks = [];

        async function initApp() {
            try {
                const res = await fetch('links.json');
                if (res.ok) globalLinks = await res.json();
            } catch (e) {
                console.log("Could not load links.json:", e);
            }
            initTabs();
        }

        function initTabs() {
            const tabBar = document.getElementById('tab-bar');
            tabBar.innerHTML = '';
            Object.keys(LEAGUES).forEach(league => {
                const btn = document.createElement('button');
                btn.className = `tab-btn ${league === activeLeague ? 'active' : ''}`;
                btn.innerText = league;
                btn.onclick = () => switchTab(league, btn);
                tabBar.appendChild(btn);
            });
            fetchLeagueData(activeLeague);
        }

        function switchTab(league, btn) {
            activeLeague = league;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            fetchLeagueData(league);
        }

        function toggleSubpage(open) {
            const actionbar = document.getElementById('top-action-container');
            const subpage = document.getElementById('subpage-view');
            const listcontent = document.getElementById('list-content-container');
            if (open) {
                if(actionbar) actionbar.style.display = 'none';
                if(listcontent) listcontent.style.display = 'none';
                if(subpage) subpage.style.display = 'block';
            } else {
                if(subpage) subpage.style.display = 'none';
                if(actionbar) actionbar.style.display = 'flex';
                if(listcontent) listcontent.style.display = 'block';
            }
        }

        function toggleUfcDivision(el) {
            el.classList.toggle('expanded');
        }

        function getDateParam(leagueKey) {
            const now = new Date();
            const fmt = (d) => `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
            if (leagueKey === "MLB") return fmt(now);
            if (leagueKey === "NFL") {
                const dow = now.getDay(); 
                let dAdd = dow === 1 ? 0 : dow === 0 ? 1 : (1 + 7 - dow) % 7;
                const end = new Date(now); end.setDate(now.getDate() + dAdd);
                return `${fmt(now)}-${fmt(end)}`;
            } else {
                const next = new Date(now); next.setDate(now.getDate() + 7);
                return `${fmt(now)}-${fmt(next)}`;
            }
        }

        function findMatchingLinks(game) {
            if (!globalLinks || globalLinks.length === 0) return [];
            const clean = (str) => str.replace(/\(\d+\)\s*/, '').toLowerCase().trim();
            const hF = clean(game.homeTeam), aF = clean(game.awayTeam);
            const hN = hF.split(' ').pop(), aN = aF.split(' ').pop();
            const matches = [];
            for (let item of globalLinks) {
                const t = item.title.toLowerCase();
                if ((t.includes(hF) || t.includes(hN)) && (t.includes(aF) || t.includes(aN))) {
                    if (!matches.includes(item.href)) matches.push(item.href);
                }
            }
            return matches;
        }

        async function fetchLeagueData(league) {
            const container = document.getElementById('game-list');
            document.getElementById('filter-bar').style.display = 'none';
            const config = LEAGUES[league];

            let topActionHtml = "", subpageHtml = "";

            if (config.isBoxing) {
                topActionHtml = `<div class="top-action-bar" id="top-action-container"><button class="top-action-btn" onclick="toggleSubpage(true)"><i class="fa-solid fa-belt"></i> View Current Boxing Champions</button></div>`;
                subpageHtml = `<div class="subpage-container" id="subpage-view"><div class="subpage-header"><span class="subpage-title"><i class="fa-solid fa-belt"></i> Major Boxing Champions</span><button class="close-subpage-btn" onclick="toggleSubpage(false)">Back</button></div><div class="champions-grid">${BOXING_CHAMPIONS.map(bc => `<div class="weight-class-row"><span class="weight-name">${bc.weight}</span><span class="weight-champs">${bc.champions}</span></div>`).join('')}</div></div>`;
            } else if (config.isUfcRankings) {
                topActionHtml = `<div class="top-action-bar" id="top-action-container"><button class="top-action-btn" onclick="toggleSubpage(true)"><i class="fa-solid fa-trophy"></i> View UFC Champions & Top 10 Rankings</button></div>`;
                subpageHtml = `
                    <div class="subpage-container" id="subpage-view">
                        <div class="subpage-header">
                            <span class="subpage-title"><i class="fa-solid fa-trophy"></i> UFC Divisions & Top 10</span>
                            <button class="close-subpage-btn" onclick="toggleSubpage(false)">Back</button>
                        </div>
                        <div class="champions-grid">
                            ${UFC_FULL_RANKINGS.map(div => `
                                <div class="ufc-div-card" onclick="toggleUfcDivision(this)">
                                    <div class="ufc-div-header">
                                        <span class="ufc-div-title">${div.weight}</span>
                                        <span class="ufc-champ-preview"><i class="fa-solid fa-crown" style="color:#f59e0b;"></i> ${div.champion} <i class="fa-solid fa-chevron-down" style="font-size:0.65rem;"></i></span>
                                    </div>
                                    <div class="ufc-rankings-body">
                                        <div style="font-size: 0.7rem; font-weight:700; color:#60a5fa; margin-bottom:4px;">Top 10 Contenders:</div>
                                        ${div.rankings.map((f, i) => `
                                            <div class="ufc-rank-row">
                                                <span class="rank-num">#${i + 1}</span>
                                                <span class="rank-name">${f}</span>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (config.standingsUrl) {
                topActionHtml = `<div class="top-action-bar" id="top-action-container"><button class="top-action-btn" onclick="toggleSubpage(true)"><i class="fa-solid fa-table-list"></i> View ${league} Standings</button></div>`;
                subpageHtml = `<div class="subpage-container" id="subpage-view"><div class="subpage-header"><span class="subpage-title"><i class="fa-solid fa-table-list"></i> ${league} Standings</span><button class="close-subpage-btn" onclick="toggleSubpage(false)">Back</button></div><div class="standings-iframe-wrap"><iframe src="${config.standingsUrl}" loading="lazy"></iframe></div></div>`;
            }

            if (config.type === "scraped") {
                container.className = "";
                const filteredItems = globalLinks.filter(item => item.category === config.category);
                let listHtml = topActionHtml + subpageHtml + `<div id="list-content-container">`;
                if (filteredItems.length > 0) {
                    listHtml += filteredItems.map(item => `
                        <div class="card">
                            <div style="font-size: 0.8rem; font-weight: 700;">${item.title}</div>
                            <div class="stream-link-container">
                                <span style="color: #60a5fa; font-weight: 600; font-size: 0.7rem; margin-right:auto;">${item.time || 'Upcoming'}</span>
                                <a href="${item.href}" target="_blank" class="stream-btn"><i class="fa-solid fa-play"></i> Watch</a>
                            </div>
                        </div>
                    `).join('');
                } else {
                    listHtml += `<p class='loading'>No events found.</p>`;
                }
                listHtml += `</div>`;
                container.innerHTML = listHtml;
                return;
            }

            container.className = "loading";
            container.innerHTML = "Fetching schedule...";

            if (cache[league]) {
                currentGames = cache[league];
                setupConferenceFilter(currentGames);
                renderGames(currentGames, topActionHtml, subpageHtml);
                return;
            }

            try {
                const dateParam = getDateParam(league);
                const urls = league === "CFB" ? [
                    `https://site.api.espn.com/apis/site/v2/sports/${config.endpoint}/scoreboard?groups=80&dates=${dateParam}&limit=300`,
                    `https://site.api.espn.com/apis/site/v2/sports/${config.endpoint}/scoreboard?groups=81&dates=${dateParam}&limit=300`
                ] : [`https://site.api.espn.com/apis/site/v2/sports/${config.endpoint}/scoreboard?dates=${dateParam}&limit=300`];

                const responses = await Promise.all(urls.map(u => fetch(u).then(r => r.json())));
                let rawEvents = [];
                responses.forEach(r => { if (r.events) rawEvents = rawEvents.concat(r.events); });

                const gameMap = new Map();
                rawEvents.forEach(event => {
                    const comp = event.competitions[0];
                    const state = event.status.type.state.toLowerCase();
                    if (state === 'post' || state === 'final') return;

                    const dateObj = new Date(event.date);
                    const home = comp.competitors.find(c => c.homeAway === 'home') || {};
                    const away = comp.competitors.find(c => c.homeAway === 'away') || {};

                    const confSet = new Set();
                    const resolveConf = (td) => {
                        const tn = td.team?.displayName || "", sn = td.team?.shortDisplayName || "";
                        if (tn.includes("Notre Dame") || sn === "Notre Dame" || sn === "UConn") return "Independents";
                        const rId = String(td.team?.conferenceId || td.conferenceId || "");
                        return CFB_MAP[rId] || td.team?.conference?.name || null;
                    };
                    const hConf = resolveConf(home), aConf = resolveConf(away);
                    if (hConf) confSet.add(hConf);
                    if (aConf) confSet.add(aConf);
                    if (confSet.size === 0) confSet.add("General / Other");

                    const timeStr = dateObj.toLocaleTimeString('en-US', { timeZone: 'America/Denver', hour: 'numeric', minute: '2-digit' });
                    const dateStr = dateObj.toLocaleDateString('en-US', { timeZone: 'America/Denver', month: 'short', day: 'numeric' });

                    const getTeam = (td, rank) => {
                        const loc = td.team?.location || "";
                        const name = td.team?.name || td.team?.displayName || "TBD";
                        let city = loc, mascot = name;
                        if (loc && td.team?.displayName?.startsWith(loc)) {
                            mascot = td.team.displayName.replace(loc, "").trim();
                        }
                        return { city: `${rank}${city}`, name: mascot };
                    };

                    const hRank = home.curatedRank?.current && home.curatedRank.current < 99 ? `(${home.curatedRank.current}) ` : '';
                    const aRank = away.curatedRank?.current && away.curatedRank.current < 99 ? `(${away.curatedRank.current}) ` : '';

                    const gObj = {
                        id: event.id, utcTime: dateObj.getTime(),
                        displayTime: `${dateStr} @ ${timeStr} MST`,
                        statusState: state, statusDetail: state === 'in' ? (event.status.type.detail || 'LIVE') : 'UPCOMING',
                        homeCity: getTeam(home, hRank).city, homeTeam: getTeam(home, hRank).name, homeLogo: home.team?.logo || '',
                        awayCity: getTeam(away, aRank).city, awayTeam: getTeam(away, aRank).name, awayLogo: away.team?.logo || '',
                        conferences: Array.from(confSet)
                    };
                    gObj.streamLinks = findMatchingLinks(gObj);
                    gameMap.set(event.id, gObj);
                });

                currentGames = Array.from(gameMap.values()).sort((a, b) => a.utcTime - b.utcTime);
                cache[league] = currentGames;
                setupConferenceFilter(currentGames);
                renderGames(currentGames, topActionHtml, subpageHtml);
            } catch (err) {
                console.error(err);
                container.innerHTML = "<p class='loading'>Failed to load data.</p>";
            }
        }

        function setupConferenceFilter(games) {
            const filterBar = document.getElementById('filter-bar');
            const select = document.getElementById('conf-select');
            if (LEAGUES[activeLeague].type !== "espn" || activeLeague !== "CFB") {
                filterBar.style.display = 'none';
                return;
            }
            const confs = new Set();
            games.forEach(g => g.conferences.forEach(c => confs.add(c)));
            select.innerHTML = '<option value="ALL">All Conferences</option>';
            Array.from(confs).sort().forEach(c => {
                const opt = document.createElement('option');
                opt.value = c; opt.innerText = c;
                select.appendChild(opt);
            });
            filterBar.style.display = 'flex';
        }

        function filterByConference() {
            const sel = document.getElementById('conf-select').value;
            const config = LEAGUES[activeLeague];
            let topActionHtml = "", subpageHtml = "";
            // Rebuild minimal headers for views
            if (config.isUfcRankings) {
                topActionHtml = `<div class="top-action-bar" id="top-action-container"><button class="top-action-btn" onclick="toggleSubpage(true)"><i class="fa-solid fa-trophy"></i> View UFC Champions & Top 10 Rankings</button></div>`;
                subpageHtml = `<div class="subpage-container" id="subpage-view"><div class="subpage-header"><span class="subpage-title"><i class="fa-solid fa-trophy"></i> UFC Divisions</span><button class="close-subpage-btn" onclick="toggleSubpage(false)">Back</button></div><div class="champions-grid">${UFC_FULL_RANKINGS.map(div => `<div class="ufc-div-card" onclick="toggleUfcDivision(this)"><div class="ufc-div-header"><span class="ufc-div-title">${div.weight}</span><span class="ufc-champ-preview"><i class="fa-solid fa-crown" style="color:#f59e0b;"></i> ${div.champion} <i class="fa-solid fa-chevron-down" style="font-size:0.65rem;"></i></span></div><div class="ufc-rankings-body"><div style="font-size: 0.7rem; font-weight:700; color:#60a5fa; margin-bottom:4px;">Top 10 Contenders:</div>${div.rankings.map((f, i) => `<div class="ufc-rank-row"><span class="rank-num">#${i + 1}</span><span class="rank-name">${f}</span></div>`).join('')}</div></div>`).join('')}</div></div>`;
            }
            if (sel === "ALL") renderGames(currentGames, topActionHtml, subpageHtml);
            else renderGames(currentGames.filter(g => g.conferences.includes(sel)), topActionHtml, subpageHtml);
        }

        function renderGames(games, topActionHtml = "", subpageHtml = "") {
            const container = document.getElementById('game-list');
            container.className = "";
            let html = topActionHtml + subpageHtml + `<div id="list-content-container">`;
            if (!games.length) {
                html += "<p class='loading'>No games scheduled.</p>";
            } else {
                html += games.map(g => `
                    <div class="card">
                        <div class="card-main">
                            <div class="team away">
                                <div class="team-text-stack">
                                    <span class="team-city">${g.awayCity}</span>
                                    <span class="team-name">${g.awayTeam}</span>
                                </div>
                                <img src="${g.awayLogo}" alt="" onerror="this.style.display='none'">
                            </div>
                            <div class="info">
                                <div class="time">${g.displayTime}</div>
                                <div class="status ${g.statusState === 'in' ? 'live' : ''}">${g.statusDetail}</div>
                            </div>
                            <div class="team home">
                                <img src="${g.homeLogo}" alt="" onerror="this.style.display='none'">
                                <div class="team-text-stack">
                                    <span class="team-city">${g.homeCity}</span>
                                    <span class="team-name">${g.homeTeam}</span>
                                </div>
                            </div>
                        </div>
                        ${g.streamLinks && g.streamLinks.length ? `
                            <div class="stream-link-container">
                                ${g.streamLinks.map((l, i) => `<a href="${l}" target="_blank" class="stream-btn"><i class="fa-solid fa-play"></i> Stream ${i+1}</a>`).join('')}
                            </div>
                        ` : ''}
                    </div>
                `).join('');
            }
            html += `</div>`;
            container.innerHTML = html;
        }

        initApp();
    </script>
</body>
</html>
