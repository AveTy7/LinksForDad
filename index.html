<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sports Stream Hub</title>
    
    <!-- Mobile Web App Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="StreamHub">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 30px;
        }

        header {
            background-color: var(--card-bg);
            padding: 16px;
            text-align: center;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: 700;
        }

        /* Category Navigation Bar */
        .category-bar {
            display: flex;
            overflow-x: auto;
            padding: 12px 16px;
            gap: 10px;
            background-color: var(--bg-color);
            scrollbar-width: none;
        }

        .category-bar::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid #334155;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .cat-btn.active {
            background-color: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
        }

        .container {
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-title {
            font-weight: 600;
            font-size: 1rem;
        }

        .card-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .watch-btn {
            background-color: var(--accent-color);
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .watch-btn:hover {
            background-color: var(--accent-hover);
        }

        .hub-banner {
            background: linear-gradient(135deg, #1e3a8a, #1e293b);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid #3b82f6;
        }

        .hub-banner h2 {
            font-size: 1.1rem;
            margin-bottom: 6px;
        }

        .hub-banner p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        .main-btn {
            display: inline-block;
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Sports Stream Hub</h1>
    </header>

    <div class="category-bar">
        <button class="cat-btn active" onclick="selectCategory('NFL', this)">NFL</button>
        <button class="cat-btn" onclick="selectCategory('NBA', this)">NBA</button>
        <button class="cat-btn" onclick="selectCategory('MLB', this)">MLB</button>
        <button class="cat-btn" onclick="selectCategory('UFC', this)">UFC</button>
        <button class="cat-btn" onclick="selectCategory('Boxing', this)">Boxing</button>
    </div>

    <div class="container">
        <!-- Main Direct Hub Banner -->
        <div class="hub-banner">
            <h2 id="hub-title">NFL Live Stream Hub</h2>
            <p>Access all live games, schedules, and links on MyBuffStreams.</p>
            <a id="main-hub-btn" href="https://mybuffstreams.plus/nfl" target="_blank" class="main-btn">
                Open NFL Streams Page ➔
            </a>
        </div>

        <div style="margin-bottom: 12px; font-weight: 600; font-size: 0.9rem; color: var(--text-muted);">
            QUICK ACCESS CHANNELS
        </div>

        <div id="quick-links">
            <!-- Populated via Javascript -->
        </div>
    </div>

    <script>
        const categories = {
            NFL: {
                title: "NFL Live Stream Hub",
                url: "https://mybuffstreams.plus/nfl",
                links: [
                    { title: "Main NFL Schedule & Games", sub: "Live Sunday & Prime Games", url: "https://mybuffstreams.plus/nfl" },
                    { title: "NFL RedZone / Live Feed", sub: "Continuous Live Coverage", url: "https://mybuffstreams.plus/nfl" }
                ]
            },
            NBA: {
                title: "NBA Basketball Hub",
                url: "https://mybuffstreams.plus/nba",
                links: [
                    { title: "Today's NBA Game List", sub: "Live Matchups & Channels", url: "https://mybuffstreams.plus/nba" },
                    { title: "NBA TV Stream", sub: "24/7 Basketball Coverage", url: "https://mybuffstreams.plus/nba" }
                ]
            },
            MLB: {
                title: "MLB Baseball Hub",
                url: "https://mybuffstreams.plus/mlb",
                links: [
                    { title: "Today's MLB Game List", sub: "All Live Ballgames", url: "https://mybuffstreams.plus/mlb" }
                ]
            },
            UFC: {
                title: "UFC & MMA Fight Hub",
                url: "https://mybuffstreams.plus/mma",
                links: [
                    { title: "Main Card & Prelims Pass", sub: "Live Fight Night Coverage", url: "https://mybuffstreams.plus/mma" }
                ]
            },
            Boxing: {
                title: "Boxing Events Hub",
                url: "https://mybuffstreams.plus/boxing",
                links: [
                    { title: "Boxing Live Cards", sub: "Main Event Streams", url: "https://mybuffstreams.plus/boxing" }
                ]
            }
        };

        function selectCategory(catKey, btn) {
            // Update Tab UI
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const cat = categories[catKey];
            
            // Update Banner
            document.getElementById('hub-title').innerText = cat.title;
            const mainBtn = document.getElementById('main-hub-btn');
            mainBtn.href = cat.url;
            mainBtn.innerText = `Open ${catKey} Streams Page ➔`;

            // Update Cards
            const container = document.getElementById('quick-links');
            container.innerHTML = '';

            cat.links.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-info">
                        <span class="card-title">${item.title}</span>
                        <span class="card-sub">${item.sub}</span>
                    </div>
                    <a href="${item.url}" target="_blank" class="watch-btn">Watch</a>
                `;
                container.appendChild(card);
            });
        }

        // Load NFL by default
        selectCategory('NFL', document.querySelector('.cat-btn'));
    </script>
</body>
</html>
