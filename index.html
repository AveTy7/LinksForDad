<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sports Stream Hub</title>
    
    <!-- Mobile Web App Capability -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="StreamHub">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 30px;
        }

        header {
            background-color: var(--card-bg);
            padding: 16px;
            text-align: center;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 700;
        }

        /* Category Selector Bar */
        .category-bar {
            display: flex;
            overflow-x: auto;
            padding: 12px 16px;
            gap: 10px;
            background-color: var(--bg-color);
            scrollbar-width: none;
        }

        .category-bar::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid #334155;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .cat-btn.active {
            background-color: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
        }

        /* Stream List */
        .container {
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .status-msg {
            text-align: center;
            padding: 24px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-right: 12px;
        }

        .card-title {
            font-weight: 600;
            font-size: 0.95rem;
            line-height: 1.3;
        }

        .card-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .watch-btn {
            background-color: var(--accent-color);
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .watch-btn:hover {
            background-color: var(--accent-hover);
        }

        .direct-hub-btn {
            display: block;
            width: 100%;
            text-align: center;
            background-color: #334155;
            color: var(--text-color);
            text-decoration: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            margin-top: 16px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Sports Stream Hub</h1>
    </header>

    <div class="category-bar">
        <button class="cat-btn active" onclick="selectCategory('NFL', this)">NFL</button>
        <button class="cat-btn" onclick="selectCategory('NBA', this)">NBA</button>
        <button class="cat-btn" onclick="selectCategory('MLB', this)">MLB</button>
        <button class="cat-btn" onclick="selectCategory('UFC', this)">UFC</button>
        <button class="cat-btn" onclick="selectCategory('Boxing', this)">Boxing</button>
    </div>

    <div class="container">
        <div id="game-list">
            <div class="status-msg">Fetching live games...</div>
        </div>

        <a id="direct-link" href="#" target="_blank" class="direct-hub-btn">
            Open Main League Hub
        </a>
    </div>

    <script>
        const categories = {
            NFL: { path: "nfl", name: "NFL" },
            NBA: { path: "nba", name: "NBA" },
            MLB: { path: "mlb", name: "MLB" },
            UFC: { path: "mma", name: "UFC / MMA" },
            Boxing: { path: "boxing", name: "Boxing" }
        };

        let currentCategory = 'NFL';

        async function fetchGames(categoryKey) {
            const container = document.getElementById('game-list');
            const directLink = document.getElementById('direct-link');
            const cat = categories[categoryKey];

            const targetUrl = `https://mybuffstreams.plus/${cat.path}`;
            directLink.href = targetUrl;
            directLink.innerText = `Open Main ${cat.name} Page`;

            container.innerHTML = `<div class="status-msg">Fetching live ${cat.name} matchups...</div>`;

            try {
                // Using a CORS proxy to allow cross-domain web fetching from mobile browsers
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
                const response = await fetch(proxyUrl);
                
                if (!response.ok) throw new Error("Network response failed");
                
                const data = await response.json();
                const htmlString = data.contents;

                // Parse the raw HTML text
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlString, 'text/html');

                // Find game links matching the target site's layout
                const gameElements = doc.querySelectorAll('a[href*="/' + cat.path + '"]');
                const games = [];

                gameElements.forEach(el => {
                    const href = el.getAttribute('href');
                    const text = el.innerText.trim();

                    // Filter out generic navigation links
                    if (href && text && text.length > 3 && !text.toLowerCase().includes('schedule') && !text.toLowerCase().includes('streams')) {
                        const fullLink = href.startsWith('http') ? href : `https://mybuffstreams.plus${href}`;
                        
                        // Prevent duplicates
                        if (!games.some(g => g.link === fullLink)) {
                            games.push({ title: text, link: fullLink });
                        }
                    }
                });

                if (games.length === 0) {
                    container.innerHTML = `
                        <div class="status-msg">
                            No live individual games listed right now.<br>Tap below to visit the main league page.
                        </div>`;
                    return;
                }

                container.innerHTML = '';
                games.forEach(game => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-info">
                            <span class="card-title">${game.title}</span>
                            <span class="card-sub">Live / Upcoming</span>
                        </div>
                        <a href="${game.link}" target="_blank" class="watch-btn">Watch</a>
                    `;
                    container.appendChild(card);
                });

            } catch (err) {
                container.innerHTML = `
                    <div class="status-msg">
                        Unable to load dynamic list automatically.<br>Use the main button below to view current games.
                    </div>`;
            }
        }

        function selectCategory(categoryKey, buttonElement) {
            currentCategory = categoryKey;
            
            // Highlight current button
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');

            fetchGames(categoryKey);
        }

        // Initial fetch on app open
        fetchGames('NFL');
    </script>
</body>
</html>
