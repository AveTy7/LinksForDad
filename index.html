<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Schedule (MST)</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #2563eb;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 16px; }
        header { text-align: center; margin-bottom: 16px; }
        .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 16px; }
        .tab-btn {
            background: var(--card); color: var(--muted); border: 1px solid var(--border);
            padding: 8px 16px; border-radius: 20px; font-weight: 600; white-space: nowrap; cursor: pointer;
        }
        .tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        .card {
            background: var(--card); border: 1px solid var(--border); border-radius: 12px;
            padding: 12px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
        }
        .team { display: flex; align-items: center; gap: 8px; flex: 1; }
        .team.away { justify-content: flex-end; text-align: right; }
        .team img { width: 32px; height: 32px; object-fit: contain; }
        .info { text-align: center; padding: 0 12px; }
        .time { color: #60a5fa; font-weight: 600; font-size: 0.85rem; }
        .status { color: var(--muted); font-size: 0.75rem; margin-top: 2px; }
    </style>
</head>
<body>

    <header>
        <h2>Sports Schedule Hub</h2>
        <p style="color: var(--muted); font-size: 0.8rem;">Times in MST (UTC-7)</p>
    </header>

    <div class="tabs" id="tab-bar"></div>
    <div id="game-list">Loading live games...</div>

    <script>
        const LEAGUES = {
            "MLB": "baseball/mlb",
            "NBA": "basketball/nba",
            "NFL": "football/nfl",
            "CFB": "football/college-football",
            "CBB": "basketball/mens-college-basketball"
        };

        let activeLeague = "NFL";
        const cache = {};

        function initTabs() {
            const tabBar = document.getElementById('tab-bar');
            Object.keys(LEAGUES).forEach(league => {
                const btn = document.createElement('button');
                btn.className = `tab-btn ${league === activeLeague ? 'active' : ''}`;
                btn.innerText = league;
                btn.onclick = () => switchTab(league, btn);
                tabBar.appendChild(btn);
            });
            fetchLeagueData(activeLeague);
        }

        function switchTab(league, btn) {
            activeLeague = league;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            fetchLeagueData(league);
        }

        async function fetchLeagueData(league) {
            const container = document.getElementById('game-list');
            container.innerHTML = "Loading schedule...";

            if (cache[league]) {
                renderGames(cache[league]);
                return;
            }

            try {
                const endpoint = LEAGUES[league];
                const resp = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${endpoint}/scoreboard`);
                const data = await resp.json();
                
                const games = (data.events || []).map(event => {
                    const comp = event.competitions[0];
                    const home = comp.competitors.find(c => c.homeAway === 'home') || {};
                    const away = comp.competitors.find(c => c.homeAway === 'away') || {};
                    
                    // Convert date to MST
                    const dateObj = new Date(event.date);
                    const timeStr = dateObj.toLocaleTimeString('en-US', { 
                        timeZone: 'America/Denver', 
                        hour: 'numeric', 
                        minute: '2-digit' 
                    });
                    const dateStr = dateObj.toLocaleDateString('en-US', { 
                        timeZone: 'America/Denver', 
                        month: 'short', 
                        day: 'numeric' 
                    });

                    return {
                        id: event.id,
                        utcTime: dateObj.getTime(),
                        displayTime: `${dateStr} @ ${timeStr} MST`,
                        status: event.status.type.state.toUpperCase(),
                        homeTeam: home.team?.displayName || 'TBD',
                        homeLogo: home.team?.logo || '',
                        awayTeam: away.team?.displayName || 'TBD',
                        awayLogo: away.team?.logo || ''
                    };
                }).sort((a, b) => a.utcTime - b.utcTime);

                cache[league] = games;
                renderGames(games);
            } catch (err) {
                container.innerHTML = "Failed to load schedule data.";
            }
        }

        function renderGames(games) {
            const container = document.getElementById('game-list');
            if (!games.length) {
                container.innerHTML = "<p style='text-align:center; color: var(--muted);'>No upcoming games scheduled.</p>";
                return;
            }

            container.innerHTML = games.map(g => `
                <div class="card">
                    <div class="team away">
                        <span>${g.awayTeam}</span>
                        <img src="${g.awayLogo}" alt="">
                    </div>
                    <div class="info">
                        <div class="time">${g.displayTime}</div>
                        <div class="status">${g.status}</div>
                    </div>
                    <div class="team home">
                        <img src="${g.homeLogo}" alt="">
                        <span>${g.homeTeam}</span>
                    </div>
                </div>
            `).join('');
        }

        initTabs();
    </script>
</body>
</html>
