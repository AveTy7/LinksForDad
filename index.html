<!DOCTYPE html>
<html lang="en" class="dark skin-midnight">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Schedule Hub (MST)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0b0f19;
            --card: #131d31;
            --accent: #2563eb;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #1e293b;
            --live: #22c55e;
            --stream: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 16px; max-width: 600px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 16px; }
        header h2 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.5px; }
        header p { color: var(--muted); font-size: 0.75rem; margin-top: 2px; }

        .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; }
        
        .tab-btn {
            background: var(--card); color: var(--muted); border: 1px solid var(--border);
            padding: 6px 14px; border-radius: 16px; font-size: 0.8rem; font-weight: 600; white-space: nowrap; cursor: pointer;
        }
        .tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

        .filter-container {
            margin-bottom: 12px; display: none; align-items: center; justify-content: space-between;
            background: var(--card); padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
        }
        .filter-label { font-size: 0.8rem; color: var(--muted); font-weight: 600; }
        .conference-select {
            background: var(--bg); color: var(--text); border: 1px solid var(--border);
            padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; outline: none; max-width: 60%;
        }

        .top-action-bar {
            background: var(--card); border: 1px solid var(--border); border-radius: 10px;
            padding: 10px; margin-bottom: 12px;
        }
        .top-action-btn {
            background: var(--accent); color: white; border: none; width: 100%;
            padding: 10px; border-radius: 8px; font-size: 0.85rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
        }
        .top-action-btn:hover { filter: brightness(1.1); }

        .subpage-container {
            background: var(--card); border: 1px solid var(--border); border-radius: 10px;
            padding: 12px; margin-bottom: 12px; display: none;
        }
        .subpage-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
            border-bottom: 1px solid var(--border); padding-bottom: 8px;
        }
        .subpage-title { font-size: 0.85rem; font-weight: 700; color: #60a5fa; display: flex; align-items: center; gap: 6px; }
        .close-subpage-btn {
            background: var(--border); color: var(--text); border: none; padding: 4px 10px;
            border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer;
        }
        .close-subpage-btn:hover { background: #334155; }

        .champions-grid { 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            max-height: 75vh; 
            overflow-y: auto; 
            padding-right: 2px; 
        }
        .champions-grid::-webkit-scrollbar { width: 4px; }
        .champions-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .espn-standings-table {
            width: 100%; border-collapse: collapse; background: var(--bg); border-radius: 6px; overflow: hidden; margin-bottom: 8px; font-size: 0.70rem;
        }
        .espn-standings-table th {
            background: rgba(30, 41, 59, 0.9); color: var(--muted); text-align: left; padding: 8px 6px; font-weight: 700;
        }
        .espn-standings-table td {
            padding: 8px 6px; border-bottom: 1px solid rgba(30, 41, 59, 0.4); color: var(--text); vertical-align: middle;
        }
        .espn-standings-table tr:last-child td { border-bottom: none; }
        .espn-div-title {
            font-size: 0.8rem; font-weight: 700; color: #60a5fa; margin: 8px 0 4px 2px;
        }

        .ufc-div-card {
            background: var(--bg); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 6px;
            flex-shrink: 0;
        }
        .ufc-div-header {
            padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer;
        }
        .ufc-div-header:hover { background: rgba(37, 99, 235, 0.08); }
        .ufc-div-title { font-size: 0.82rem; font-weight: 700; color: var(--text); }
        .ufc-champ-preview { font-size: 0.75rem; color: #60a5fa; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        
        .ufc-rankings-body {
            display: none; padding: 0 12px; background: rgba(15, 23, 42, 0.5);
        }
        .ufc-div-card.expanded .ufc-rankings-body {
            display: block;
            max-height: 260px;
            overflow-y: auto;
            padding: 10px 12px;
            border-top: 1px solid var(--border);
        }
        .ufc-rankings-body::-webkit-scrollbar { width: 4px; }
        .ufc-rankings-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .ufc-rank-row {
            display: flex; justify-content: space-between; padding: 5px 0; font-size: 0.75rem; border-bottom: 1px solid rgba(30, 41, 59, 0.5);
        }
        .ufc-rank-row:last-child { border-bottom: none; }
        .rank-num { color: var(--muted); font-weight: 700; width: 35px; }
        .rank-name { flex: 1; font-weight: 600; text-align: left; color: var(--text); }

        .card {
            background: var(--card); border: 1px solid var(--border); border-radius: 10px;
            padding: 10px 14px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 6px;
        }
        .card-main { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        
        .team { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
        .team.away { justify-content: flex-end; text-align: right; }
        .team img { width: 24px; height: 24px; object-fit: contain; flex-shrink: 0; }
        
        .team-text-stack { display: flex; flex-direction: column; min-width: 0; }
        .team.away .team-text-stack { align-items: flex-end; }
        .team.home .team-text-stack { align-items: flex-start; }
        
        .team-city { font-size: 0.55rem; color: var(--muted); font-weight: 600; text-transform: uppercase; }
        .team-name { font-size: 0.75rem; font-weight: 700; line-height: 1.1; }
        
        .info { text-align: center; padding: 0 4px; min-width: 85px; flex-shrink: 0; }
        .time { color: #60a5fa; font-weight: 600; font-size: 0.6rem; }
        .status { color: var(--muted); font-size: 0.55rem; font-weight: 600; }
        .status.live { color: var(--live); font-weight: 700; }
        
        .stream-link-container {
            border-top: 1px solid var(--border); padding-top: 6px; display: flex; flex-wrap: wrap; gap: 6px;
        }
        .stream-btn {
            background: var(--stream); color: white; text-decoration: none;
            padding: 3px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 700;
            display: inline-flex; align-items: center; gap: 4px;
        }
        .stream-btn:hover { filter: brightness(1.1); }

        #game-list { min-height: 150px; }
        .loading { text-align: center; color: var(--muted); padding: 30px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <header>
        <h2>Sports Schedule Hub</h2>
        <p>Live & Upcoming Games • Times in MST</p>
    </header>

    <div class="tabs" id="tab-bar"></div>

    <div class="filter-container" id="filter-bar">
        <span class="filter-label" id="filter-label-text">Conference:</span>
        <select class="conference-select" id="conf-select" onchange="filterByConference()">
            <option value="ALL">All Conferences</option>
        </select>
    </div>

    <div id="game-list" class="loading">Loading schedule...</div>

    <script>
        const LEAGUES = {
            "NFL": { endpoint: "football/nfl", type: "espn", hasStandings: true, standingsLabel: "NFL Standings" },
            "NBA": { endpoint: "basketball/nba", type: "espn", hasStandings: true, standingsLabel: "NBA Standings" },
            "MLB": { endpoint: "baseball/mlb", type: "espn", hasStandings: true, standingsLabel: "MLB Standings" },
            "CFB": { endpoint: "football/college-football", type: "espn", hasStandings: true, standingsLabel: "College Football Standings" },
            "CBB": { endpoint: "basketball/mens-college-basketball", type: "espn", hasStandings: true, standingsLabel: "College Basketball Standings" },
            "MMA": { type: "scraped", category: "MMA", isUfcRankings: true },
            "Boxing": { type: "scraped", category: "Boxing", isBoxing: true }
        };

        let STANDINGS_DATA = {};
        let BOXING_CHAMPIONS = [];
        let UFC_FULL_RANKINGS = [];

        const CFB_MAP = {
            "1": "ACC", "4": "Big 12", "8": "SEC", "9": "Big Ten", "12": "Pac-12",
            "15": "Conference USA", "17": "MAC", "18": "MWC", "37": "Sun Belt", 
            "151": "American Athletic", "80": "FBS Independents", "81": "FCS"
        };

        let activeLeague = "NFL";
        const cache = {};
        let currentGames = [];
        let globalLinks = [];

        async function initApp() {
            try {
                const res = await fetch('links.json');
                if (res.ok) globalLinks = await res.json();
            } catch (e) {
                console.log("Could not load links.json:", e);
            }

            await loadExternalData();
            initTabs();
        }

        async function loadExternalData() {
            try {
                const rankRes = await fetch('rankings.json?v=' + Date.now());
                if (rankRes.ok) {
                    const rankData = await rankRes.json();
                    BOXING_CHAMPIONS = rankData.boxing || [];
                    UFC_FULL_RANKINGS = rankData.ufc || [];
                }
            } catch (e) {
                console.log("Could not load rankings.json:", e);
            }

            const fetchStandingsEndpoint = async (leagueKey, url) => {
                try {
                    const res = await fetch(url);
                    if (res.ok) {
                        const data = await res.json();
                        STANDINGS_DATA[leagueKey] = parseEspnStandings(data);
                    }
                } catch (err) {
                    console.log(`Failed to fetch standings for ${leagueKey}:`, err);
                }
            };

            await Promise.all([
                fetchStandingsEndpoint("NFL", "https://site.api.espn.com/apis/v2/sports/football/nfl/standings"),
                fetchStandingsEndpoint("NBA", "https://site.api.espn.com/apis/v2/sports/basketball/nba/standings"),
                fetchStandingsEndpoint("MLB", "https://site.api.espn.com/apis/v2/sports/baseball/mlb/standings")
            ]);
        }

        function parseEspnStandings(data) {
            let divisionsResult = [];
            const processGroup = (group) => {
                if (group.standings && group.standings.entries) {
                    let divName = group.name || group.abbreviation || "Standings";
                    let teams = group.standings.entries.map(entry => {
                        let name = entry.team.displayName;
                        let stats = entry.stats || [];
                        let w = stats.find(s => s.name === "wins" || s.type === "wins")?.value || 0;
                        let l = stats.find(s => s.name === "losses" || s.type === "losses")?.value || 0;
                        let pct = stats.find(s => s.name === "winPercent" || s.type === "winPercent")?.displayValue || ".000";
                        return { name, w, l, pct };
                    });
                    divisionsResult.push({ division: divName, teams });
                }
                if (group.children) {
                    group.children.forEach(sub => processGroup(sub));
                }
            };
            if (data.children) {
                data.children.forEach(c => processGroup(c));
            } else if (data.standings?.children) {
                data.standings.children.forEach(c => processGroup(c));
            }
            return divisionsResult;
        }

        function initTabs() {
            const tabBar = document.getElementById('tab-bar');
            tabBar.innerHTML = '';
            Object.keys(LEAGUES).forEach(league => {
                const btn = document.createElement('button');
                btn.className = `tab-btn ${league === activeLeague ? 'active' : ''}`;
                btn.innerText = league;
                btn.onclick = () => switchTab(league, btn);
                tabBar.appendChild(btn);
            });
            fetchLeagueData(activeLeague);
        }

        function switchTab(league, btn) {
            activeLeague = league;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            fetchLeagueData(league);
        }

        function toggleSubpage(open) {
            const actionbar = document.getElementById('top-action-container');
            const subpage = document.getElementById('subpage-view');
            const listcontent = document.getElementById('list-content-container');
            const filterbar = document.getElementById('filter-bar');
            
            if (open) {
                if(actionbar) actionbar.style.display = 'none';
                if(listcontent) listcontent.style.display = 'none';
                if(filterbar) filterbar.style.display = 'none';
                if(subpage) subpage.style.display = 'block';
            } else {
                if(subpage) subpage.style.display = 'none';
                if(actionbar) actionbar.style.display = 'flex';
                if(listcontent) listcontent.style.display = 'block';
                if((activeLeague === "CFB" || activeLeague === "CBB") && filterbar) filterbar.style.display = 'flex';
            }
        }

        function toggleUfcDivision(el) {
            const wasExpanded = el.classList.contains('expanded');
            document.querySelectorAll('.ufc-div-card').forEach(card => card.classList.remove('expanded'));
            if (!wasExpanded) {
                el.classList.add('expanded');
            }
        }

        function getDateParam(leagueKey) {
            const now = new Date();
            const fmt = (d) => `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
            if (leagueKey === "MLB") return fmt(now);
            if (leagueKey === "NFL") {
                const dow = now.getDay(); 
                let dAdd = dow === 1 ? 0 : dow === 0 ? 1 : (1 + 7 - dow) % 7;
                const end = new Date(now); end.setDate(now.getDate() + dAdd);
                return `${fmt(now)}-${fmt(end)}`;
            } else {
                const next = new Date(now); next.setDate(now.getDate() + 7);
                return `${fmt(now)}-${fmt(next)}`;
            }
        }

        function findMatchingLinks(game) {
            if (!globalLinks || globalLinks.length === 0) return [];
            const clean = (str) => str.replace(/\(\d+\)\s*/, '').toLowerCase().trim();
            const hF = clean(game.homeTeam), aF = clean(game.awayTeam);
            const hN = hF.split(' ').pop(), aN = aF.split(' ').pop();
            const matches = [];
            for (let item of globalLinks) {
                const t = item.title.toLowerCase();
                if ((t.includes(hF) || t.includes(hN)) && (t.includes(aF) || t.includes(aN))) {
                    if (!matches.includes(item.href)) matches.push(item.href);
                }
            }
            return matches;
        }

        function setupCollegeFilter() {
            const filterBar = document.getElementById('filter-bar');
            const select = document.getElementById('conf-select');
            const labelText = document.getElementById('filter-label-text');
            
            if (activeLeague !== "CFB" && activeLeague !== "CBB") {
                filterBar.style.display = 'none';
                return;
            }

            labelText.innerText = "Rankings / Conf:";
            const confs = STANDINGS_DATA[activeLeague] ? Object.keys(STANDINGS_DATA[activeLeague]) : [];
            
            select.innerHTML = '';
            confs.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c; 
                opt.innerText = c;
                select.appendChild(opt);
            });
            filterBar.style.display = 'flex';
        }

        function getSubpageContentHtml(selectedConf = "AP Top 25") {
            const config = LEAGUES[activeLeague];
            if (config.isBoxing) {
                return {
                    topAction: `<div class="top-action-bar" id="top-action-container"><button class="top-action-btn" onclick="toggleSubpage(true)"><i class="fa-solid fa-belt"></i> View Major Boxing Champions</button></div>`,
                    subpage: `<div class="subpage-container" id="subpage-view">
                        <div class="subpage-header">
                            <span class="subpage-title"><i class="fa-solid fa-belt"></i> Major Boxing Champions</span>
                            <button class="close-subpage-btn" onclick="toggleSubpage(false)">Back</button>
                        </div>
                        <div class="champions-grid">
                            <table class="espn-standings-table">
                                <thead>
                                    <tr>
                                        <th>Division</th>
                                        <th>WBA</th>
                                        <th>WBC</th>
                                        <th>IBF</th>
                                        <th>WBO</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${BOXING_CHAMPIONS.map(div => `
                                        <tr>
                                            <td style="font-weight:700; color:#60a5fa;">${div.weight}</td>
                                            <td>${div.wba}</td>
                                            <td>${div.wbc}</td>
                                            <td>${div.ibf}</td>
                                            <td>${div.wbo}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>`
                };
            } else if (config.isUfcRankings) {
                return {
                    topAction: `<div class="top-action-bar" id="top-action-container"><button class="top-action-btn" onclick="toggleSubpage(true)"><i class="fa-solid fa-trophy"></i> View UFC Champions & Top 10 Rankings</button></div>`,
                    subpage: `<div class="subpage-container" id="subpage-view"><div class="subpage-header"><span class="subpage-title"><i class="fa-solid fa-trophy"></i> UFC Divisions & Top 10</span><button class="close-subpage-btn" onclick="toggleSubpage(false)">Back</button></div><div class="champions-grid">${UFC_FULL_RANKINGS.map(div => `<div class="ufc-div-card" onclick="toggleUfcDivision(this)"><div class="ufc-div-header"><span class="ufc-div-title">${div.weight}</span><span class="ufc-champ-preview"><i class="fa-solid fa-crown" style="color:#f59e0b;"></i> ${div.champion} <i class="fa-solid fa-chevron-down" style="font-size:0.65rem;"></i></span></div><div class="ufc-rankings-body"><div style="font-size: 0.7rem; font-weight:700; color:#60a5fa; margin-bottom:4px;">Top 10 Contenders:</div>${div.rankings.map((f, i) => `<div class="ufc-rank-row"><span class="rank-num">#${i + 1}</span><span class="rank-name">${f}</span></div>`).join('')}</div></div>`).join('')}</div></div>`
                };
            } else if (config.hasStandings) {
                let standingsToRender = [];
                let label = config.standingsLabel;

                if (activeLeague === "CFB" || activeLeague === "CBB") {
                    const dataObj = STANDINGS_DATA[activeLeague] || {};
                    const targetKey = selectedConf && dataObj[selectedConf] ? selectedConf : Object.keys(dataObj)[0];
                    standingsToRender = targetKey ? [{ division: targetKey, teams: dataObj[targetKey] }] : [];
                    label = `${targetKey} Standings`;
                } else {
                    standingsToRender = STANDINGS_DATA[activeLeague] || [];
                }

                return {
                    topAction: `<div class="top-action-bar" id="top-action-container"><button class="top-action-btn" onclick="toggleSubpage(true)"><i class="fa-solid fa-table-list"></i> View ${label}</button></div>`,
                    subpage: `<div class="subpage-container" id="subpage-view"><div class="subpage-header"><span class="subpage-title"><i class="fa-solid fa-table-list"></i> ${label}</span><button class="close-subpage-btn" onclick="toggleSubpage(false)">Back</button></div><div class="champions-grid">${standingsToRender.map(div => `<div><div class="espn-div-title">${div.division}</div><table class="espn-standings-table"><thead><tr><th>Team</th><th class="num-col" style="text-align:center; width:40px;">W</th><th class="num-col" style="text-align:center; width:40px;">L</th><th class="num-col" style="text-align:center; width:50px;">PCT</th></tr></thead><tbody>${div.teams.map(t => `<tr><td>${t.name}</td><td class="num-col" style="text-align:center;">${t.w}</td><td class="num-col" style="text-align:center;">${t.l}</td><td class="num-col" style="text-align:center;">${t.pct}</td></tr>`).join('')}</tbody></table></div>`).join('')}</div></div>`
                };
            }
            return { topAction: "", subpage: "" };
        }

        async function fetchLeagueData(league) {
            const container = document.getElementById('game-list');
            document.getElementById('filter-bar').style.display = 'none';
            const config = LEAGUES[league];

            setupCollegeFilter();
            const subContent = getSubpageContentHtml("AP Top 25");

            if (config.type === "scraped") {
                container.className = "";
                const filteredItems = globalLinks.filter(item => item.category === config.category);
                let listHtml = subContent.topAction + subContent.subpage + `<div id="list-content-container">`;
                if (filteredItems.length > 0) {
                    listHtml += filteredItems.map(item => `
                        <div class="card">
                            <div style="font-size: 0.8rem; font-weight: 700;">${item.title}</div>
                            <div class="stream-link-container">
                                <span style="color: #60a5fa; font-weight: 600; font-size: 0.7rem; margin-right:auto;">${item.time || 'Upcoming'}</span>
                                <a href="${item.href}" target="_blank" class="stream-btn"><i class="fa-solid fa-play"></i> Watch</a>
                            </div>
                        </div>
                    `).join('');
                } else {
                    listHtml += `<p class='loading'>No events found.</p>`;
                }
                listHtml += `</div>`;
                container.innerHTML = listHtml;
                return;
            }

            container.className = "loading";
            container.innerHTML = "Fetching schedule...";

            if (cache[league]) {
                currentGames = cache[league];
                setupEspnConferenceFilter(currentGames);
                renderGames(currentGames, subContent.topAction, subContent.subpage);
                return;
            }

            try {
                const dateParam = getDateParam(league);
                const urls = league === "CFB" ? [
                    `https://site.api.espn.com/apis/site/v2/sports/${config.endpoint}/scoreboard?groups=80&dates=${dateParam}&limit=300`,
                    `https://site.api.espn.com/apis/site/v2/sports/${config.endpoint}/scoreboard?groups=81&dates=${dateParam}&limit=300`
                ] : [`https://site.api.espn.com/apis/site/v2/sports/${config.endpoint}/scoreboard?dates=${dateParam}&limit=300`];

                const responses = await Promise.all(urls.map(u => fetch(u).then(r => r.json())));
                let rawEvents = [];
                responses.forEach(r => { if (r.events) rawEvents = rawEvents.concat(r.events); });

                const gameMap = new Map();
                rawEvents.forEach(event => {
                    const comp = event.competitions[0];
                    const state = event.status.type.state.toLowerCase();
                    if (state === 'post' || state === 'final') return;

                    const dateObj = new Date(event.date);
                    const home = comp.competitors.find(c => c.homeAway === 'home') || {};
                    const away = comp.competitors.find(c => c.homeAway === 'away') || {};

                    const confSet = new Set();
                    const resolveConf = (td) => {
                        const tn = td.team?.displayName || "", sn = td.team?.shortDisplayName || "";
                        if (tn.includes("Notre Dame") || sn === "Notre Dame" || sn === "UConn") return "Independents";
                        const rId = String(td.team?.conferenceId || td.conferenceId || "");
                        const mapped = CFB_MAP[rId] || td.team?.conference?.name || null;
                        if (mapped === "FCS") return "FCS";
                        return mapped;
                    };
                    const hConf = resolveConf(home), aConf = resolveConf(away);
                    if (hConf) confSet.add(hConf);
                    if (aConf) confSet.add(aConf);
                    if (confSet.size === 0) confSet.add("FCS");

                    const timeStr = dateObj.toLocaleTimeString('en-US', { timeZone: 'America/Denver', hour: 'numeric', minute: '2-digit' });
                    const dateStr = dateObj.toLocaleDateString('en-US', { timeZone: 'America/Denver', month: 'short', day: 'numeric' });

                    const getTeam = (td, rank) => {
                        const loc = td.team?.location || "";
                        const name = td.team?.name || td.team?.displayName || "TBD";
                        let city = loc, mascot = name;
                        if (loc && td.team?.displayName?.startsWith(loc)) {
                            mascot = td.team.displayName.replace(loc, "").trim();
                        }
                        return { city: `${rank}${city}`, name: mascot };
                    };

                    const hRank = home.curatedRank?.current && home.curatedRank.current < 99 ? `(${home.curatedRank.current}) ` : '';
                    const aRank = away.curatedRank?.current && away.curatedRank.current < 99 ? `(${away.curatedRank.current}) ` : '';

                    const gObj = {
                        id: event.id, utcTime: dateObj.getTime(),
                        displayTime: `${dateStr} @ ${timeStr} MST`,
                        statusState: state, statusDetail: state === 'in' ? (event.status.type.detail || 'LIVE') : 'UPCOMING',
                        homeCity: getTeam(home, hRank).city, homeTeam: getTeam(home, hRank).name, homeLogo: home.team?.logo || '',
                        awayCity: getTeam(away, aRank).city, awayTeam: getTeam(away, aRank).name, awayLogo: away.team?.logo || '',
                        conferences: Array.from(confSet)
                    };
                    gObj.streamLinks = findMatchingLinks(gObj);
                    gameMap.set(event.id, gObj);
                });

                currentGames = Array.from(gameMap.values()).sort((a, b) => a.utcTime - b.utcTime);
                cache[league] = currentGames;
                setupEspnConferenceFilter(currentGames);
                renderGames(currentGames, subContent.topAction, subContent.subpage);
            } catch (err) {
                console.error(err);
                container.innerHTML = "<p class='loading'>Failed to load data.</p>";
            }
        }

        function setupEspnConferenceFilter(games) {
            const filterBar = document.getElementById('filter-bar');
            const select = document.getElementById('conf-select');
            const labelText = document.getElementById('filter-label-text');

            if (activeLeague !== "CFB" && activeLeague !== "CBB") {
                filterBar.style.display = 'none';
                return;
            }
            labelText.innerText = "Rankings / Conf:";
            const confs = new Set();
            games.forEach(g => g.conferences.forEach(c => confs.add(c)));
            select.innerHTML = '<option value="ALL">All Conferences</option>';
            Array.from(confs).sort().forEach(c => {
                const opt = document.createElement('option');
                opt.value = c; 
                opt.innerText = c;
                select.appendChild(opt);
            });
            filterBar.style.display = 'flex';
        }

        function filterByConference() {
            const sel = document.getElementById('conf-select').value;
            const subContent = getSubpageContentHtml(sel);

            if (activeLeague === "CFB" || activeLeague === "CBB") {
                renderGames([], subContent.topAction, subContent.subpage);
                return;
            }

            if (sel === "ALL") renderGames(currentGames, subContent.topAction, subContent.subpage);
            else renderGames(currentGames.filter(g => g.conferences.includes(sel)), subContent.topAction, subContent.subpage);
        }

        function renderGames(games, topActionHtml = "", subpageHtml = "") {
            const container = document.getElementById('game-list');
            container.className = "";
            let html = topActionHtml + subpageHtml + `<div id="list-content-container">`;
            
            if (activeLeague === "CFB" || activeLeague === "CBB") {
                const selectedFilter = document.getElementById('conf-select').value;
                const filteredGames = (selectedFilter && selectedFilter !== "ALL") 
                    ? currentGames.filter(g => g.conferences.includes(selectedFilter))
                    : currentGames;

                if (!filteredGames.length) {
                    html += "<p class='loading'>No games scheduled.</p>";
                } else {
                    html += filteredGames.map(g => `
                        <div class="card">
                            <div class="card-main">
                                <div class="team away">
                                    <div class="team-text-stack">
                                        <span class="team-city">${g.awayCity}</span>
                                        <span class="team-name">${g.awayTeam}</span>
                                    </div>
                                    <img src="${g.awayLogo}" alt="" onerror="this.style.display='none'">
                                </div>
                                <div class="info">
                                    <div class="time">${g.displayTime}</div>
                                    <div class="status ${g.statusState === 'in' ? 'live' : ''}">${g.statusDetail}</div>
                                </div>
                                <div class="team home">
                                    <img src="${g.homeLogo}" alt="" onerror="this.style.display='none'">
                                    <div class="team-text-stack">
                                        <span class="team-city">${g.homeCity}</span>
                                        <span class="team-name">${g.homeTeam}</span>
                                    </div>
                                </div>
                            </div>
                            ${g.streamLinks && g.streamLinks.length ? `
                                <div class="stream-link-container">
                                    ${g.streamLinks.map((l, i) => `<a href="${l}" target="_blank" class="stream-btn"><i class="fa-solid fa-play"></i> Stream ${i+1}</a>`).join('')}
                                </div>
                            ` : ''}
                        </div>
                    `).join('');
                }
                html += `</div>`;
                container.innerHTML = html;
                return;
            }

            if (!games.length) {
                html += "<p class='loading'>No games scheduled.</p>";
            } else {
                html += games.map(g => `
                    <div class="card">
                        <div class="card-main">
                            <div class="team away">
                                <div class="team-text-stack">
                                    <span class="team-city">${g.awayCity}</span>
                                    <span class="team-name">${g.awayTeam}</span>
                                 </div>
                                <img src="${g.awayLogo}" alt="" onerror="this.style.display='none'">
                            </div>
                            <div class="info">
                                <div class="time">${g.displayTime}</div>
                                <div class="status ${g.statusState === 'in' ? 'live' : ''}">${g.statusDetail}</div>
                            </div>
                            <div class="team home">
                                <img src="${g.homeLogo}" alt="" onerror="this.style.display='none'">
                                <div class="team-text-stack">
                                    <span class="team-city">${g.homeCity}</span>
                                    <span class="team-name">${g.homeTeam}</span>
                                </div>
                            </div>
                        </div>
                        ${g.streamLinks && g.streamLinks.length ? `
                            <div class="stream-link-container">
                                ${g.streamLinks.map((l, i) => `<a href="${l}" target="_blank" class="stream-btn"><i class="fa-solid fa-play"></i> Stream ${i+1}</a>`).join('')}
                            </div>
                        ` : ''}
                    </div>
                `).join('');
            }
            html += `</div>`;
            container.innerHTML = html;
        }

        initApp();
    </script>
</body>
</html>
