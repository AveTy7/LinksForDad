<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sports Schedule Hub (MST)</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #2563eb;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #334155;
            --live: #22c55e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 16px; padding-bottom: 40px; }
        header { text-align: center; margin-bottom: 16px; }
        
        .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 12px; }
        .tabs::-webkit-scrollbar { display: none; }
        
        .tab-btn {
            background: var(--card); color: var(--muted); border: 1px solid var(--border);
            padding: 8px 16px; border-radius: 20px; font-weight: 600; white-space: nowrap; cursor: pointer;
        }
        .tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        
        .filter-container {
            margin-bottom: 16px;
            display: none;
            align-items: center;
            justify-content: space-between;
            background: var(--card);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .filter-label { font-size: 0.85rem; color: var(--muted); font-weight: 600; }
        .conference-select {
            background: var(--bg); color: var(--text); border: 1px solid var(--border);
            padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; outline: none;
            max-width: 60%;
        }

        .card {
            background: var(--card); border: 1px solid var(--border); border-radius: 12px;
            padding: 12px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
        }
        .team { display: flex; align-items: center; gap: 8px; flex: 1; }
        .team.away { justify-content: flex-end; text-align: right; }
        .team img { width: 32px; height: 32px; object-fit: contain; }
        .team-name { font-size: 0.9rem; font-weight: 600; }
        
        .info { text-align: center; padding: 0 12px; min-width: 110px; }
        .time { color: #60a5fa; font-weight: 600; font-size: 0.8rem; }
        .status { color: var(--muted); font-size: 0.75rem; font-weight: 600; margin-top: 2px; }
        .status.live { color: var(--live); font-weight: 700; }
        
        #game-list { min-height: 200px; }
        .loading { text-align: center; color: var(--muted); padding: 40px; }
    </style>
</head>
<body>

    <header>
        <h2>Sports Schedule Hub</h2>
        <p style="color: var(--muted); font-size: 0.8rem;">Live & Upcoming Games • Times in MST</p>
    </header>

    <div class="tabs" id="tab-bar"></div>

    <div class="filter-container" id="filter-bar">
        <span class="filter-label">Filter by Conference:</span>
        <select class="conference-select" id="conf-select" onchange="filterByConference()">
            <option value="ALL">All Conferences</option>
        </select>
    </div>

    <div id="game-list" class="loading">Loading schedule...</div>

    <script>
        const LEAGUES = {
            "MLB": { endpoint: "baseball/mlb", type: "mlb" },
            "NFL": { endpoint: "football/nfl", type: "nfl" },
            "CFB": { endpoint: "football/college-football", type: "college" },
            "CBB": { endpoint: "basketball/mens-college-basketball", type: "college" }
        };

        let activeLeague = "NFL";
        const cache = {};
        let currentGames = [];

        function initTabs() {
            const tabBar = document.getElementById('tab-bar');
            Object.keys(LEAGUES).forEach(league => {
                const btn = document.createElement('button');
                btn.className = `tab-btn ${league === activeLeague ? 'active' : ''}`;
                btn.innerText = league;
                btn.onclick = () => switchTab(league, btn);
                tabBar.appendChild(btn);
            });
            fetchLeagueData(activeLeague);
        }

        function switchTab(league, btn) {
            activeLeague = league;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            fetchLeagueData(league);
        }

        function getDateParam(leagueKey) {
            const now = new Date();
            const formatDate = (d) => d.toISOString().split('T')[0].replace(/-/g, '');

            if (leagueKey === "MLB") {
                return formatDate(now);
            } else {
                // Extended 7-day window for NFL, CFB, and CBB
                const nextWeek = new Date(now);
                nextWeek.setDate(now.getDate() + 7);
                return `${formatDate(now)}-${formatDate(nextWeek)}`;
            }
        }

        async function fetchLeagueData(league) {
            const container = document.getElementById('game-list');
            container.className = "loading";
            container.innerHTML = "Fetching schedule...";

            if (cache[league]) {
                currentGames = cache[league];
                setupConferenceFilter(currentGames);
                renderGames(currentGames);
                return;
            }

            try {
                const config = LEAGUES[league];
                const dateParam = getDateParam(league);
                
                let urls = [];
                if (league === "CFB") {
                    urls = [
                        `https://site.api.espn.com/apis/site/v2/sports/${config.endpoint}/scoreboard?groups=80&dates=${dateParam}&limit=300`,
                        `https://site.api.espn.com/apis/site/v2/sports/${config.endpoint}/scoreboard?groups=81&dates=${dateParam}&limit=300`
                    ];
                } else {
                    urls = [`https://site.api.espn.com/apis/site/v2/sports/${config.endpoint}/scoreboard?dates=${dateParam}&limit=300`];
                }

                const responses = await Promise.all(urls.map(u => fetch(u).then(r => r.json())));
                let rawEvents = [];
                responses.forEach(r => { if (r.events) rawEvents = rawEvents.concat(r.events); });

                const gameMap = new Map();

                rawEvents.forEach(event => {
                    const comp = event.competitions[0];
                    const state = event.status.type.state.toLowerCase();

                    // Only discard games that are strictly completed/final
                    if (state === 'post' || state === 'final') return;

                    const dateObj = new Date(event.date);
                    const home = comp.competitors.find(c => c.homeAway === 'home') || {};
                    const away = comp.competitors.find(c => c.homeAway === 'away') || {};

                    // Conference Extraction Logic
                    const confSet = new Set();

                    const extractConfName = (teamObj) => {
                        if (!teamObj || !teamObj.team) return null;
                        const t = teamObj.team;
                        if (t.conference && typeof t.conference === 'object') {
                            return t.conference.name || t.conference.shortName || null;
                        }
                        if (t.groups && Array.isArray(t.groups)) {
                            const group = t.groups.find(g => g.name && isNaN(g.name));
                            if (group) return group.name;
                        }
                        return null;
                    };

                    const homeConf = extractConfName(home);
                    const awayConf = extractConfName(away);

                    if (homeConf && isNaN(homeConf)) confSet.add(homeConf);
                    if (awayConf && isNaN(awayConf)) confSet.add(awayConf);

                    if (confSet.size === 0 && comp.conferenceGroup?.name && isNaN(comp.conferenceGroup.name)) {
                        confSet.add(comp.conferenceGroup.name);
                    }
                    if (confSet.size === 0) {
                        confSet.add("Other / Non-Conference");
                    }

                    const homeRank = home.curatedRank?.current && home.curatedRank.current < 99 ? `(${home.curatedRank.current}) ` : '';
                    const awayRank = away.curatedRank?.current && away.curatedRank.current < 99 ? `(${away.curatedRank.current}) ` : '';

                    const timeStr = dateObj.toLocaleTimeString('en-US', { 
                        timeZone: 'America/Denver', 
                        hour: 'numeric', 
                        minute: '2-digit' 
                    });
                    const dateStr = dateObj.toLocaleDateString('en-US', { 
                        timeZone: 'America/Denver', 
                        month: 'short', 
                        day: 'numeric' 
                    });

                    gameMap.set(event.id, {
                        id: event.id,
                        utcTime: dateObj.getTime(),
                        displayTime: `${dateStr} @ ${timeStr} MST`,
                        statusState: state,
                        statusDetail: state === 'in' ? (event.status.type.detail || 'LIVE') : 'UPCOMING',
                        homeTeam: `${homeRank}${home.team?.displayName || 'TBD'}`,
                        homeLogo: home.team?.logo || '',
                        awayTeam: `${awayRank}${away.team?.displayName || 'TBD'}`,
                        awayLogo: away.team?.logo || '',
                        conferences: Array.from(confSet)
                    });
                });

                currentGames = Array.from(gameMap.values()).sort((a, b) => a.utcTime - b.utcTime);

                cache[league] = currentGames;
                setupConferenceFilter(currentGames);
                renderGames(currentGames);

            } catch (err) {
                console.error(err);
                container.innerHTML = "<p class='loading'>Failed to load schedule data.</p>";
            }
        }

        function setupConferenceFilter(games) {
            const filterBar = document.getElementById('filter-bar');
            const select = document.getElementById('conf-select');
            
            if (LEAGUES[activeLeague].type !== "college") {
                filterBar.style.display = 'none';
                return;
            }

            const allConferences = new Set();
            games.forEach(g => {
                g.conferences.forEach(c => allConferences.add(c));
            });

            const sortedConfs = Array.from(allConferences).sort();
            select.innerHTML = '<option value="ALL">All Conferences</option>';
            sortedConfs.forEach(conf => {
                const opt = document.createElement('option');
                opt.value = conf;
                opt.innerText = conf;
                select.appendChild(opt);
            });

            filterBar.style.display = 'flex';
        }

        function filterByConference() {
            const selectedConf = document.getElementById('conf-select').value;
            if (selectedConf === "ALL") {
                renderGames(currentGames);
            } else {
                const filtered = currentGames.filter(g => g.conferences.includes(selectedConf));
                renderGames(filtered);
            }
        }

        function renderGames(games) {
            const container = document.getElementById('game-list');
            container.className = "";
            
            if (!games.length) {
                container.innerHTML = "<p class='loading'>No active or upcoming games scheduled for this timeframe.</p>";
                return;
            }

            container.innerHTML = games.map(g => `
                <div class="card">
                    <div class="team away">
                        <span class="team-name">${g.awayTeam}</span>
                        <img src="${g.awayLogo}" alt="" onerror="this.style.display='none'">
                    </div>
                    <div class="info">
                        <div class="time">${g.displayTime}</div>
                        <div class="status ${g.statusState === 'in' ? 'live' : ''}">${g.statusDetail}</div>
                    </div>
                    <div class="team home">
                        <img src="${g.homeLogo}" alt="" onerror="this.style.display='none'">
                        <span class="team-name">${g.homeTeam}</span>
                    </div>
                </div>
            `).join('');
        }

        initTabs();
    </script>
</body>
</html>
