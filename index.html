<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sports Stream Hub</title>
    
    <!-- Mobile Web App Capability -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="StreamHub">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 30px;
        }

        header {
            background-color: var(--card-bg);
            padding: 16px;
            text-align: center;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .category-bar {
            display: flex;
            overflow-x: auto;
            padding: 12px 16px;
            gap: 10px;
            background-color: var(--bg-color);
            scrollbar-width: none;
        }

        .category-bar::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid #334155;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
            cursor: pointer;
        }

        .cat-btn.active {
            background-color: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
        }

        .container {
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-right: 12px;
        }

        .card-title {
            font-weight: 600;
            font-size: 0.95rem;
            line-height: 1.3;
        }

        .card-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .watch-btn {
            background-color: var(--accent-color);
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .main-btn {
            display: block;
            width: 100%;
            text-align: center;
            background-color: #334155;
            color: var(--text-color);
            text-decoration: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            margin-top: 16px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Sports Stream Hub</h1>
    </header>

    <div class="category-bar">
        <button class="cat-btn active" onclick="selectCategory('NFL', this)">NFL</button>
        <button class="cat-btn" onclick="selectCategory('NBA', this)">NBA</button>
        <button class="cat-btn" onclick="selectCategory('MLB', this)">MLB</button>
        <button class="cat-btn" onclick="selectCategory('UFC', this)">UFC</button>
        <button class="cat-btn" onclick="selectCategory('Boxing', this)">Boxing</button>
    </div>

    <div class="container">
        <div id="game-list">
            <!-- Dynamic game cards load here -->
        </div>

        <a id="main-hub-btn" href="https://mybuffstreams.plus/nfl" target="_blank" class="main-btn">
            Open Main League Schedule ➔
        </a>
    </div>

    <script>
        // Data structure with specific teams and direct subpage URLs
        const scheduleData = {
            NFL: {
                mainUrl: "https://mybuffstreams.plus/nfl",
                games: [
                    { 
                        title: "Cincinnati Bengals vs Tampa Bay Buccaneers", 
                        sub: "NFL • Sun, 1:00 PM ET", 
                        url: "https://mybuffstreams.plus/stream/cincinnati-bengals-vs-tampa-bay-buccaneers" 
                    },
                    { 
                        title: "Detroit Lions vs New Orleans Saints", 
                        sub: "NFL • Sun, 1:00 PM ET", 
                        url: "https://mybuffstreams.plus/stream/detroit-lions-vs-new-orleans-saints" 
                    },
                    { 
                        title: "Las Vegas Raiders vs Miami Dolphins", 
                        sub: "NFL • Sun, 4:25 PM ET", 
                        url: "https://mybuffstreams.plus/stream/las-vegas-raiders-vs-miami-dolphins" 
                    },
                    { 
                        title: "New York Giants vs Dallas Cowboys", 
                        sub: "NFL • Sun, 8:20 PM ET", 
                        url: "https://mybuffstreams.plus/stream/new-york-giants-vs-dallas-cowboys" 
                    }
                ]
            },
            NBA: {
                mainUrl: "https://mybuffstreams.plus/nba",
                games: [
                    { 
                        title: "Los Angeles Lakers vs Golden State Warriors", 
                        sub: "NBA • Live Tonight", 
                        url: "https://mybuffstreams.plus/stream/los-angeles-lakers-vs-golden-state-warriors" 
                    },
                    { 
                        title: "Boston Celtics vs Milwaukee Bucks", 
                        sub: "NBA • Live Tonight", 
                        url: "https://mybuffstreams.plus/stream/boston-celtics-vs-milwaukee-bucks" 
                    }
                ]
            },
            MLB: {
                mainUrl: "https://mybuffstreams.plus/mlb",
                games: [
                    { 
                        title: "New York Yankees vs Colorado Rockies", 
                        sub: "MLB • Today 7:05 PM ET", 
                        url: "https://mybuffstreams.plus/stream/new-york-yankees-vs-colorado-rockies" 
                    },
                    { 
                        title: "Seattle Mariners vs Texas Rangers", 
                        sub: "MLB • Today 4:10 PM ET", 
                        url: "https://mybuffstreams.plus/stream/seattle-mariners-vs-texas-rangers" 
                    }
                ]
            },
            UFC: {
                mainUrl: "https://mybuffstreams.plus/mma",
                games: [
                    { 
                        title: "UFC Main Card: Championship Fight Night", 
                        sub: "MMA • Saturday Event Pass", 
                        url: "https://mybuffstreams.plus/stream/ufc-fight-night" 
                    }
                ]
            },
            Boxing: {
                mainUrl: "https://mybuffstreams.plus/boxing",
                games: [
                    { 
                        title: "World Championship Boxing Main Event", 
                        sub: "Boxing • Saturday Night Live", 
                        url: "https://mybuffstreams.plus/stream/world-championship-boxing" 
                    }
                ]
            }
        };

        function selectCategory(catKey, btnElement) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');

            const catData = scheduleData[catKey];
            const container = document.getElementById('game-list');
            const mainBtn = document.getElementById('main-hub-btn');

            mainBtn.href = catData.mainUrl;
            mainBtn.innerText = `Open Main ${catKey} Schedule Page ➔`;

            container.innerHTML = '';
            catData.games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-info">
                        <span class="card-title">${game.title}</span>
                        <span class="card-sub">${game.sub}</span>
                    </div>
                    <a href="${game.url}" target="_blank" class="watch-btn">Watch</a>
                `;
                container.appendChild(card);
            });
        }

        // Initialize default tab as NFL
        selectCategory('NFL', document.querySelector('.cat-btn'));
    </script>
</body>
</html>
