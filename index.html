<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sports Stream Hub</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="StreamHub">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 30px;
        }

        header {
            background-color: var(--card-bg);
            padding: 16px;
            text-align: center;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .category-bar {
            display: flex;
            overflow-x: auto;
            padding: 12px 16px;
            gap: 10px;
            background-color: var(--bg-color);
            scrollbar-width: none;
        }

        .category-bar::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid #334155;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
            cursor: pointer;
        }

        .cat-btn.active {
            background-color: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
        }

        .container {
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-title {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .card-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .watch-btn {
            background-color: var(--accent-color);
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .main-btn {
            display: block;
            width: 100%;
            text-align: center;
            background-color: #334155;
            color: var(--text-color);
            text-decoration: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            margin-top: 16px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Sports Stream Hub</h1>
    </header>

    <div class="category-bar">
        <button class="cat-btn active" onclick="selectCategory('NFL', this)">NFL</button>
        <button class="cat-btn" onclick="selectCategory('NBA', this)">NBA</button>
        <button class="cat-btn" onclick="selectCategory('MLB', this)">MLB</button>
        <button class="cat-btn" onclick="selectCategory('UFC', this)">UFC</button>
        <button class="cat-btn" onclick="selectCategory('Boxing', this)">Boxing</button>
    </div>

    <div class="container">
        <div id="game-list">
            <!-- Game cards load here -->
        </div>

        <a id="main-hub-btn" href="https://mybuffstreams.plus/nfl" target="_blank" class="main-btn">
            Open Main League Page ➔
        </a>
    </div>

    <script>
        // Edit this list anytime in GitHub to update your dad's game lineup!
        const scheduleData = {
            NFL: {
                mainUrl: "https://mybuffstreams.plus/nfl",
                games: [
                    { title: "NFL Game 1 (Live Feed)", sub: "Main Network Stream", url: "https://mybuffstreams.plus/nfl" },
                    { title: "NFL Game 2 (Live Feed)", sub: "Prime Stream Channel", url: "https://mybuffstreams.plus/nfl" },
                    { title: "NFL RedZone Channel", sub: "Commercial Free Live Feed", url: "https://mybuffstreams.plus/nfl" }
                ]
            },
            NBA: {
                mainUrl: "https://mybuffstreams.plus/nba",
                games: [
                    { title: "NBA Live Game Stream 1", sub: "East Coast Matchup", url: "https://mybuffstreams.plus/nba" },
                    { title: "NBA Live Game Stream 2", sub: "West Coast Matchup", url: "https://mybuffstreams.plus/nba" },
                    { title: "NBA TV Stream 24/7", sub: "Live Studio Coverage", url: "https://mybuffstreams.plus/nba" }
                ]
            },
            MLB: {
                mainUrl: "https://mybuffstreams.plus/mlb",
                games: [
                    { title: "MLB Live Ballgame 1", sub: "Featured Broadcast", url: "https://mybuffstreams.plus/mlb" },
                    { title: "MLB Live Ballgame 2", sub: "Evening Broadcast", url: "https://mybuffstreams.plus/mlb" }
                ]
            },
            UFC: {
                mainUrl: "https://mybuffstreams.plus/mma",
                games: [
                    { title: "UFC Fight Night Main Card", sub: "Live PPV/Main Event", url: "https://mybuffstreams.plus/mma" },
                    { title: "UFC Preliminary Fights", sub: "Early Prelims Feed", url: "https://mybuffstreams.plus/mma" }
                ]
            },
            Boxing: {
                mainUrl: "https://mybuffstreams.plus/boxing",
                games: [
                    { title: "World Championship Boxing Card", sub: "Main Event Stream", url: "https://mybuffstreams.plus/boxing" }
                ]
            }
        };

        function selectCategory(catKey, btnElement) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');

            const catData = scheduleData[catKey];
            const container = document.getElementById('game-list');
            const mainBtn = document.getElementById('main-hub-btn');

            mainBtn.href = catData.mainUrl;
            mainBtn.innerText = `Open Main ${catKey} Schedule Page ➔`;

            container.innerHTML = '';
            catData.games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-info">
                        <span class="card-title">${game.title}</span>
                        <span class="card-sub">${game.sub}</span>
                    </div>
                    <a href="${game.url}" target="_blank" class="watch-btn">Watch</a>
                `;
                container.appendChild(card);
            });
        }

        // Initialize with NFL
        selectCategory('NFL', document.querySelector('.cat-btn'));
    </script>
</body>
</html>
