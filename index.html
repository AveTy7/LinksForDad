<!DOCTYPE html>
<html lang="en" class="dark skin-midnight">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sports Schedule Hub (MST)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #2563eb;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #334155;
            --live: #22c55e;
            --stream: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 16px; padding-bottom: 40px; }
        header { text-align: center; margin-bottom: 16px; }
        
        .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 12px; }
        .tabs::-webkit-scrollbar { display: none; }
        
        .tab-btn {
            background: var(--card); color: var(--muted); border: 1px solid var(--border);
            padding: 8px 16px; border-radius: 20px; font-weight: 600; white-space: nowrap; cursor: pointer;
        }
        .tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        
        .filter-container {
            margin-bottom: 16px;
            display: none;
            align-items: center;
            justify-content: space-between;
            background: var(--card);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .filter-label { font-size: 0.85rem; color: var(--muted); font-weight: 600; }
        .conference-select {
            background: var(--bg); color: var(--text); border: 1px solid var(--border);
            padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; outline: none;
            max-width: 60%;
        }

        .top-action-bar {
            background: var(--card); border: 1px solid var(--border); border-radius: 12px;
            padding: 12px 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;
        }
        .top-action-btn {
            background: var(--accent); color: white; border: none;
            padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 700;
            display: inline-flex; align-items: center; gap: 8px; width: 100%; justify-content: center; cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }
        .top-action-btn:hover { opacity: 0.9; }

        .subpage-container {
            background: var(--card); border: 1px solid var(--border); border-radius: 12px;
            padding: 16px; margin-bottom: 12px; display: none; width: 100%;
        }
        .subpage-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;
            border-bottom: 1px solid var(--border); padding-bottom: 10px; gap: 10px; flex-wrap: wrap;
        }
        .subpage-title { font-size: 0.95rem; font-weight: 700; color: #60a5fa; display: flex; align-items: center; gap: 6px; word-break: break-word; flex: 1; }
        .close-subpage-btn {
            background: var(--border); color: var(--text); border: none; padding: 6px 12px;
            border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer; white-space: nowrap; flex-shrink: 0;
        }
        .close-subpage-btn:hover { background: #475569; }

        .standings-iframe-wrap {
            position: relative; width: 100%; height: 500px; border-radius: 8px; overflow: hidden; background: #fff;
        }
        .standings-iframe-wrap iframe {
            width: 100%; height: 100%; border: none;
        }

        .champions-grid {
            display: flex; flex-direction: column; gap: 10px; max-height: 520px; overflow-y: auto; padding-right: 4px;
        }
        .champions-grid::-webkit-scrollbar { width: 6px; }
        .champions-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .weight-class-row {
            display: flex; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--border);
            font-size: 0.82rem; align-items: center; background: var(--bg); border-radius: 8px; gap: 12px;
        }
        .weight-name { font-weight: 700; color: #60a5fa; width: 38%; word-break: break-word; }
        .weight-champs { width: 62%; text-align: right; font-weight: 600; word-break: break-word; }

        /* UFC Expandable Accordion Styles */
        .ufc-division-card {
            background: var(--bg); border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
        }
        .ufc-division-header {
            padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer;
            font-weight: 700; font-size: 0.85rem; color: var(--text); background: rgba(30, 41, 59, 0.6); gap: 10px;
        }
        .ufc-division-header:hover { background: rgba(37, 99, 235, 0.15); }
        .ufc-title-group { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
        .ufc-div-name { font-size: 0.85rem; font-weight: 700; color: var(--text); }
        .ufc-champ-tag { color: #f59e0b; font-size: 0.78rem; display: flex; align-items: center; gap: 5px; font-weight: 600; word-break: break-word; }
        .ufc-chevron { font-size: 0.75rem; color: var(--muted); transition: transform 0.2s; flex-shrink: 0; }
        .ufc-division-card.expanded .ufc-chevron { transform: rotate(180deg); }
        
        .ufc-rankings-list {
            display: none; padding: 12px 14px; border-top: 1px solid var(--border); background: var(--card);
            font-size: 0.8rem;
        }
        .ufc-division-card.expanded .ufc-rankings-list { display: block; }
        .ufc-rank-row {
            display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(51, 65, 85, 0.4); gap: 10px;
        }
        .ufc-rank-row:last-child { border-bottom: none; }
        .rank-num { color: var(--muted); font-weight: 700; width: 30px; flex-shrink: 0; }
        .rank-name { flex: 1; font-weight: 600; word-break: break-word; }

        .card {
            background: var(--card); border: 1px solid var(--border); border-radius: 12px;
            padding: 12px 16px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px;
        }
        .card-main { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        
        .team { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
        .team.away { justify-content: flex-end; text-align: right; }
        .team img { width: 28px; height: 28px; object-fit: contain; flex-shrink: 0; }
        
        .team-text-stack { display: flex; flex-direction: column; min-width: 0; }
        .team.away .team-text-stack { align-items: flex-end; }
        .team.home .team-text-stack { align-items: flex-start; }
        
        .team-city { font-size: 0.6rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .team-name { font-size: 0.78rem; font-weight: 700; line-height: 1.1; }
        
        .info { text-align: center; padding: 0 4px; min-width: 95px; flex-shrink: 0; }
        .time { color: #60a5fa; font-weight: 600; font-size: 0.65rem; }
        .status { color: var(--muted); font-size: 0.6rem; font-weight: 600; margin-top: 1px; }
        .status.live { color: var(--live); font-weight: 700; }
        
        .stream-link-container {
            border-top: 1px solid var(--border);
            padding-top: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }
        .stream-btn {
            background: var(--stream); color: white; text-decoration: none;
            padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700;
            display: inline-flex; align-items: center; gap: 4px;
        }
        .stream-btn:hover { opacity: 0.9; }

        #game-list { min-height: 200px; }
        .loading { text-align: center; color: var(--muted); padding: 40px; }
    </style>
</head>
<body class="page-home layout-fluid">

    <header class="site-header header-sticky">
        <h2>Sports Schedule Hub</h2>
        <p style="color: var(--muted); font-size: 0.8rem;">Live & Upcoming Games • Times in MST</p>
    </header>

    <div class="tabs" id="tab-bar"></div>

    <div class="filter-container" id="filter-bar">
        <span class="filter-label">Filter by Conference:</span>
        <select class="conference-select" id="conf-select" onchange="filterByConference()">
            <option value="ALL">All Conferences</option>
        </select>
    </div>

    <div id="game-list" class="loading">Loading schedule...</div>

    <script>
        const LEAGUES = {
            "NFL": { endpoint: "football/nfl", type: "espn", standingsUrl: "https://www.espn.com/nfl/standings" },
            "NBA": { type: "scraped", category: "NBA", standingsUrl: "https://www.espn.com/nba/standings" },
            "MLB": { endpoint: "baseball/mlb", type: "espn", standingsUrl: "https://www.espn.com/mlb/standings" },
            "CFB": { endpoint: "football/college-football", type: "espn", standingsUrl: "https://www.espn.com/college-football/standings" },
            "CBB": { endpoint: "basketball/mens-college-basketball", type: "espn", standingsUrl: "https://www.espn.com/mens-college-basketball/standings" },
            "MMA": { type: "scraped", category: "MMA", isUfcRankings: true },
            "Boxing": { type: "scraped", category: "Boxing", isBoxing: true }
        };

        const BOXING_CHAMPIONS = [
            { weight: "Heavyweight", champions: "Oleksandr Usyk (The Ring), Filip Hrgović (IBF)" },
            { weight: "Cruiserweight", champions: "David Benavidez (WBA/WBO)" },
            { weight: "Light Heavyweight", champions: "Artur Beterbiev / Unified division" },
            { weight: "Super Middleweight", champions: "Saúl 'Canelo' Álvarez / Contested elites" },
            { weight: "Middleweight", champions: "Erislandy Lara (WBA), Janibek Alimkhanuly (WBO/IBF)" },
            { weight: "Welterweight", champions: "Jaron Ennis (WBA/IBF/WBO)" },
            { weight: "Lightweight", champions: "Gervonta Davis (WBA), Shakur Stevenson (WBC)" },
            { weight: "Featherweight", champions: "Rafael Espinoza (WBO), Brandon Figueroa (WBC)" }
        ];

        const UFC_FULL_RANKINGS = [
            {
                weight: "Heavyweight",
                champion: "Tom Aspinall",
                rankings: ["Ciryl Gane", "Alexander Volkov", "Sergei Pavlovich", "Curtis Blaydes", "Waldo Cortes Acosta", "Serghei Spivac", "Derrick Lewis", "Marcin Tybura", "Jairzinho Rozenstruik", "Alexander Romanov"]
            },
            {
                weight: "Light Heavyweight",
                champion: "Carlos Ulberg",
                rankings: ["Magomed Ankalaev", "Jiří Procházka", "Alex Pereira", "Khalil Rountree Jr.", "Paulo Costa", "Jamahal Hill", "Azamat Murzakanov", "Jan Błachowicz", "Volkan Oezdemir", "Aleksandar Rakić"]
            },
            {
                weight: "Middleweight",
                champion: "Sean Strickland",
                rankings: ["Khamzat Chimaev", "Dricus Du Plessis", "Nassourdine Imavov", "Brendan Allen", "Israel Adesanya", "Anthony Hernandez", "Caio Borralho", "Robert Whittaker", "Roman Dolidze", "Jared Cannonier"]
            },
            {
                weight: "Welterweight",
                champion: "Islam Makhachev",
                rankings: ["Carlos Prates", "Ian Machado Garry", "Michael Morales", "Jack Della Maddalena", "Sean Brady", "Gabriel Bonfim", "Belal Muhammad", "Leon Edwards", "Gilbert Burns", "Geoff Neal"]
            },
            {
                weight: "Lightweight",
                champion: "Justin Gaethje",
                rankings: ["Ilia Topuria", "Arman Tsarukyan", "Charles Oliveira", "Max Holloway", "Benoît Saint Denis", "Mateusz Gamrot", "Renato Moicano", "Paddy Pimblett", "Dan Hooker", "Jalin Turner"]
            },
            {
                weight: "Featherweight",
                champion: "Alexander Volkanovski",
                rankings: ["Movsar Evloev", "Diego Lopes", "Lerone Murphy", "Aljamain Sterling", "Arnold Allen", "Jean Silva", "Pat Sabatini", "Youssef Zalal", "Giga Chikadze", "Calvin Kattar"]
            },
            {
                weight: "Bantamweight",
                champion: "Petr Yan",
                rankings: ["Merab Dvalishvili", "Umar Nurmagomedov", "Sean O'Malley", "Cory Sandhagen", "Mario Bautista", "Song Yadong", "David Martinez", "Deiveson Figueiredo", "Rob Font", "Kyler Phillips"]
            },
            {
                weight: "Flyweight",
                champion: "Joshua Van",
                rankings: ["Alexandre Pantoja", "Manel Kape", "Tatsuro Taira", "Brandon Royval", "Lone'er Kavanagh", "Asu Almabayev", "Kyoji Horiguchi", "Brandon Moreno", "Tim Elliott", "Amir Albazi"]
            },
            {
                weight: "Women's Bantamweight",
                champion: "Kayla Harrison",
                rankings: ["Joselyne Edwards", "Norma Dumont", "Luana Santos", "Julianna Peña", "Ailin Perez", "Yana Santos", "Jacqueline Cavalcanti", "Raquel Pennington", "Miesha Tate", "Pannie Kianzad"]
            },
            {
                weight: "Women's Flyweight",
                champion: "Valentina Shevchenko",
                rankings: ["Natalia Silva", "Manon Fiorot", "Alexa Grasso", "Erin Blanchfield", "Zhang Weili", "Jasmine Jasudavicius", "Rose Namajunas", "Maycee Barber", "Karine Silva", "Tracy Cortez"]
            },
            {
                weight: "Women's Strawweight",
                champion: "Mackenzie Dern",
                rankings: ["Zhang Weili", "Tatiana Suarez", "Virna Jandiroba", "Denise Gomes", "Amanda Lemos", "Luana Pinheiro", "Loopy Godinez", "Tabatha Ricci", "Jessica Andrade", "Piera Rodriguez"]
            }
        ];

        const CFB_MAP = {
            "1": "ACC", "4": "Big 12", "8": "SEC", "9": "Big Ten", "12": "Pac-12",
            "15": "Conference USA", "17": "MAC", "18": "MWC", "37": "Sun Belt", 
            "151": "American Athletic", "80": "FBS Independents", "81": "FCS"
        };

        let activeLeague = "NFL";
        const cache = {};
        let currentGames = [];
        let globalLinks = [];

        async function initApp() {
            try {
                const res = await fetch('links.json');
                if (res.ok) {
                    globalLinks = await res.json();
                }
            } catch (e) {
                console.log("Could not load links.json:", e);
            }
            initTabs();
        }

        function initTabs() {
            const tabBar = document.getElementById('tab-bar');
            tabBar.innerHTML = '';
            Object.keys(LEAGUES).forEach(league => {
                const btn = document.createElement('button');
                btn.className = `tab-btn ${league === activeLeague ? 'active' : ''}`;
                btn.innerText = league;
                btn.onclick = () => switchTab(league, btn);
                tabBar.appendChild(btn);
            });
            fetchLeagueData(activeLeague);
        }

        function switchTab(league, btn) {
            activeLeague = league;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            fetchLeagueData(league);
        }

        function toggleSubpage(open) {
            const actionbar = document.getElementById('top-action-container');
            const subpage = document.getElementById('subpage-view');
            const listcontent = document.getElementById('list-content-container');
            if (open) {
                if(actionbar) actionbar.style.display = 'none';
                if(listcontent) listcontent.style.display = 'none';
                if(subpage) subpage.style.display = 'block';
            } else {
                if(subpage) subpage.style.display = 'none';
                if(actionbar) actionbar.style.display = 'flex';
                if(listcontent) listcontent.style.display = 'block';
            }
        }

        function toggleUfcDivision(cardElement) {
            cardElement.classList.toggle('expanded');
        }

        function getDateParam(leagueKey) {
            const now = new Date();
            const formatDate = (d) => {
                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${year}${month}${day}`;
            };

            if (leagueKey === "MLB") {
                return formatDate(now);
            } else if (leagueKey === "NFL") {
                const dayOfWeek = now.getDay(); 
                let daysUntilMonday = dayOfWeek === 1 ? 0 : dayOfWeek === 0 ? 1 : (1 + 7 - dayOfWeek) % 7;
                const endMonday = new Date(now);
                endMonday.setDate(now.getDate() + daysUntilMonday);
                return `${formatDate(now)}-${formatDate(endMonday)}`;
            } else {
                const nextWeek = new Date(now);
                nextWeek.setDate(now.getDate() + 7);
                return `${formatDate(now)}-${formatDate(nextWeek)}`;
            }
        }

        function findMatchingLinks(game) {
            if (!globalLinks || globalLinks.length === 0) return [];
            const clean = (str) => str.replace(/\(\d+\)\s*/, '').toLowerCase().trim();
            const homeFull = clean(game.homeTeam);
            const awayFull = clean(game.awayTeam);
            const homeNick = homeFull.split(' ').pop();
            const awayNick = awayFull.split(' ').pop();

            const matches = [];
            for (let item of globalLinks) {
                const title = item.title.toLowerCase();
                if ((title.includes(homeFull) || title.includes(homeNick)) && 
                    (title.includes(awayFull) || title.includes(awayNick))) {
                    if (!matches.includes(item.href)) {
                        matches.push(item.href);
                    }
                }
            }
            return matches;
        }

        async function fetchLeagueData(league) {
            const container = document.getElementById('game-list');
            const filterBar = document.getElementById('filter-bar');
            filterBar.style.display = 'none';
            const config = LEAGUES[league];

            let topActionHtml = "";
            let subpageHtml = "";

            if (config.isBoxing) {
                topActionHtml = `
                    <div class="top-action-bar" id="top-action-container">
                        <button class="top-action-btn" onclick="toggleSubpage(true)">
                            <i class="fa-solid fa-belt"></i> View Current Boxing Champions
                        </button>
                    </div>
                `;
                subpageHtml = `
                    <div class="subpage-container" id="subpage-view">
                        <div class="subpage-header">
                            <span class="subpage-title"><i class="fa-solid fa-belt"></i> Major Boxing Champions by Weight Class</span>
                            <button class="close-subpage-btn" onclick="toggleSubpage(false)">Back to Schedule</button>
                        </div>
                        <div class="champions-grid">
                            ${BOXING_CHAMPIONS.map(bc => `
                                <div class="weight-class-row">
                                    <span class="weight-name">${bc.weight}</span>
                                    <span class="weight-champs">${bc.champions}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (config.isUfcRankings) {
                topActionHtml = `
                    <div class="top-action-bar" id="top-action-container">
                        <button class="top-action-btn" onclick="toggleSubpage(true)">
                            <i class="fa-solid fa-trophy"></i> View UFC Champions & Top 10 Rankings
                        </button>
                    </div>
                `;
                subpageHtml = `
                    <div class="subpage-container" id="subpage-view">
                        <div class="subpage-header">
                            <span class="subpage-title"><i class="fa-solid fa-trophy"></i> UFC Divisions & Rankings (Click to Expand)</span>
                            <button class="close-subpage-btn" onclick="toggleSubpage(false)">Back to Schedule</button>
                        </div>
                        <div class="champions-grid">
                            ${UFC_FULL_RANKINGS.map(div => `
                                <div class="ufc-division-card" onclick="toggleUfcDivision(this)">
                                    <div class="ufc-division-header">
                                        <div class="ufc-title-group">
                                            <span class="ufc-div-name">${div.weight}</span>
                                            <span class="ufc-champ-tag">
                                                <i class="fa-solid fa-crown"></i> Champ: ${div.champion}
                                            </span>
                                        </div>
                                        <i class="fa-solid fa-chevron-down ufc-chevron"></i>
                                    </div>
                                    <div class="ufc-rankings-list">
                                        <div style="font-weight: 700; color: #60a5fa; margin-bottom: 6px;">Top 10 Contenders:</div>
                                        ${div.rankings.map((fighter, idx) => `
                                            <div class="ufc-rank-row">
                                                <span class="rank-num">#${idx + 1}</span>
                                                <span class="rank-name">${fighter}</span>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (config.standingsUrl) {
                topActionHtml = `
                    <div class="top-action-bar" id="top-action-container">
                        <button class="top-action-btn" onclick="toggleSubpage(true)">
                            <i class="fa-solid fa-table-list"></i> View ${league} Standings
                        </button>
                    </div>
                `;
                subpageHtml = `
                    <div class="subpage-container" id="subpage-view">
                        <div class="subpage-header">
                            <span class="subpage-title"><i class="fa-solid fa-table-list"></i> ${league} Standings</span>
                            <button class="close-subpage-btn" onclick="toggleSubpage(false)">Back to Schedule</button>
                        </div>
                        <div class="standings-iframe-wrap">
                            <iframe src="${config.standingsUrl}" loading="lazy"></iframe>
                        </div>
                    </div>
                `;
            }

            // Render Scraped Event Leagues (NBA, MMA, Boxing)
            if (config.type === "scraped") {
                container.className = "";
                const filteredItems = globalLinks.filter(item => item.category === config.category);

                let listHtml = topActionHtml + subpageHtml + `<div id="list-content-container">`;
                if (filteredItems.length > 0) {
                    listHtml += filteredItems.map(item => `
                        <div class="card">
                            <div style="font-size: 0.9rem; font-weight: 700; width: 100%; text-align: left; padding: 2px 0;">
                                ${item.title}
                            </div>
                            <div class="stream-link-container">
                                <div style="display: flex; flex-direction: column; margin-right: auto;">
                                    <span style="color: #60a5fa; font-weight: 600; font-size: 0.75rem;">${item.time || 'Upcoming'}</span>
                                    <span style="color: var(--muted); font-size: 0.65rem; font-weight: 600;">SCHEDULED</span>
                                </div>
                                <a href="${item.href}" target="_blank" class="stream-btn">
                                    <i class="fa-solid fa-play"></i> Watch Stream
                                </a>
                            </div>
                        </div>
                    `).join('');
                } else {
                    listHtml += `<p class='loading'>No events found for ${league}. Run the GitHub Action workflow.</p>`;
                }
                listHtml += `</div>`;
                container.innerHTML = listHtml;
                return;
            }

            // Render ESPN Schedule Leagues (NFL, MLB, CFB, CBB)
            container.className = "loading";
            container.innerHTML = "Fetching schedule...";

            if (cache[league]) {
                currentGames = cache[league];
                setupConferenceFilter(currentGames);
                renderGames(currentGames, topActionHtml, subpageHtml);
                return;
            }

            try {
                const dateParam = getDateParam(league);
                let urls = [];
                if (league === "CFB") {
                    urls = [
                        `https://site.api.espn.com/apis/site/v2/sports/${config.endpoint}/scoreboard?groups=80&dates=${dateParam}&limit=300`,
                        `https://site.api.espn.com/apis/site/v2/sports/${config.endpoint}/scoreboard?groups=81&dates=${dateParam}&limit=300`
                    ];
                } else {
                    urls = [`https://site.api.espn.com/apis/site/v2/sports/${config.endpoint}/scoreboard?dates=${dateParam}&limit=300`];
                }

                const responses = await Promise.all(urls.map(u => fetch(u).then(r => r.json())));
                let rawEvents = [];
                responses.forEach(r => { if (r.events) rawEvents = rawEvents.concat(r.events); });

                const gameMap = new Map();
                rawEvents.forEach(event => {
                    const comp = event.competitions[0];
                    const state = event.status.type.state.toLowerCase();
                    if (state === 'post' || state === 'final') return;

                    const dateObj = new Date(event.date);
                    const home = comp.competitors.find(c => c.homeAway === 'home') || {};
                    const away = comp.competitors.find(c => c.homeAway === 'away') || {};

                    const confSet = new Set();
                    const resolveConf = (teamData) => {
                        const teamName = teamData.team?.displayName || "";
                        const shortName = teamData.team?.shortDisplayName || "";
                        if (teamName.includes("Notre Dame") || shortName === "Notre Dame" || shortName === "UConn") return "Independents";
                        const rawId = String(teamData.team?.conferenceId || teamData.conferenceId || "");
                        if (CFB_MAP[rawId]) return CFB_MAP[rawId];
                        return teamData.team?.conference?.name || teamData.team?.conference?.shortName || null;
                    };

                    const homeConf = resolveConf(home);
                    const awayConf = resolveConf(away);
                    if (homeConf) confSet.add(homeConf);
                    if (awayConf) confSet.add(awayConf);
                    if (confSet.size === 0) confSet.add("General / Other");

                    const homeRank = home.curatedRank?.current && home.curatedRank.current < 99 ? `(${home.curatedRank.current}) ` : '';
                    const awayRank = away.curatedRank?.current && away.curatedRank.current < 99 ? `(${away.curatedRank.current}) ` : '';

                    const timeStr = dateObj.toLocaleTimeString('en-US', { timeZone: 'America/Denver', hour: 'numeric', minute: '2-digit' });
                    const dateStr = dateObj.toLocaleDateString('en-US', { timeZone: 'America/Denver', month: 'short', day: 'numeric' });

                    const formatTeamDetails = (teamData, rankPrefix) => {
                        const location = teamData.team?.location || "";
                        const name = teamData.team?.name || teamData.team?.displayName || "TBD";
                        
                        if (location && teamData.team?.displayName?.startsWith(location)) {
                            const mascot = teamData.team.displayName.replace(location, "").trim();
                            return { city: `${rankPrefix}${location}`, name: mascot || name };
                        }
                        
                        const parts = (teamData.team?.displayName || "TBD").split(' ');
                        if (parts.length > 1) {
                            const city = parts.slice(0, -1).join(' ');
                            const mascot = parts[parts.length - 1];
                            return { city: `${rankPrefix}${city}`, name: mascot };
                        }
                        return { city: "", name: `${rankPrefix}${teamData.team?.displayName || 'TBD'}` };
                    };

                    const homeDetails = formatTeamDetails(home, homeRank);
                    const awayDetails = formatTeamDetails(away, awayRank);

                    const gameObj = {
                        id: event.id,
                        utcTime: dateObj.getTime(),
                        displayTime: `${dateStr} @ ${timeStr} MST`,
                        statusState: state,
                        statusDetail: state === 'in' ? (event.status.type.detail || 'LIVE') : 'UPCOMING',
                        homeCity: homeDetails.city,
                        homeTeam: homeDetails.name,
                        homeLogo: home.team?.logo || '',
                        awayCity: awayDetails.city,
                        awayTeam: awayDetails.name,
                        awayLogo: away.team?.logo || '',
                        conferences: Array.from(confSet)
                    };

                    gameObj.streamLinks = findMatchingLinks(gameObj);
                    gameMap.set(event.id, gameObj);
                });

                currentGames = Array.from(gameMap.values()).sort((a, b) => a.utcTime - b.utcTime);
                cache[league] = currentGames;
                setupConferenceFilter(currentGames);
                renderGames(currentGames, topActionHtml, subpageHtml);

            } catch (err) {
                console.error(err);
                container.innerHTML = "<p class='loading'>Failed to load schedule data.</p>";
            }
        }

        function setupConferenceFilter(games) {
            const filterBar = document.getElementById('filter-bar');
            const select = document.getElementById('conf-select');
            if (LEAGUES[activeLeague].type !== "espn" || activeLeague !== "CFB") {
                filterBar.style.display = 'none';
                return;
            }
            const allConferences = new Set();
            games.forEach(g => g.conferences.forEach(c => allConferences.add(c)));
            const sortedConfs = Array.from(allConferences).sort();
            select.innerHTML = '<option value="ALL">All Conferences</option>';
            sortedConfs.forEach(conf => {
                const opt = document.createElement('option');
                opt.value = conf;
                opt.innerText = conf;
                select.appendChild(opt);
            });
            filterBar.style.display = 'flex';
        }

        function filterByConference() {
            const selectedConf = document.getElementById('conf-select').value;
            const config = LEAGUES[activeLeague];
            let topActionHtml = "";
            let subpageHtml = "";

            if (config.isBoxing) {
                topActionHtml = `<div class="top-action-bar" id="top-action-container"><button class="top-action-btn" onclick="toggleSubpage(true)"><i class="fa-solid fa-belt"></i> View Current Boxing Champions</button></div>`;
                subpageHtml = `<div class="subpage-container" id="subpage-view"><div class="subpage-header"><span class="subpage-title"><i class="fa-solid fa-belt"></i> Major Boxing Champions by Weight Class</span><button class="close-subpage-btn" onclick="toggleSubpage(false)">Back to Schedule</button></div><div class="champions-grid">${BOXING_CHAMPIONS.map(bc => `<div class="weight-class-row"><span class="weight-name">${bc.weight}</span><span class="weight-champs">${bc.champions}</span></div>`).join('')}</div></div>`;
            } else if (config.isUfcRankings) {
                topActionHtml = `<div class="top-action-bar" id="top-action-container"><button class="top-action-btn" onclick="toggleSubpage(true)"><i class="fa-solid fa-trophy"></i> View UFC Champions & Top 10 Rankings</button></div>`;
                subpageHtml = `<div class="subpage-container" id="subpage-view"><div class="subpage-header"><span class="subpage-title"><i class="fa-solid fa-trophy"></i> UFC Divisions & Rankings</span><button class="close-subpage-btn" onclick="toggleSubpage(false)">Back to Schedule</button></div><div class="champions-grid">${UFC_FULL_RANKINGS.map(div => `<div class="ufc-division-card" onclick="toggleUfcDivision(this)"><div class="ufc-division-header"><div class="ufc-title-group"><span class="ufc-div-name">${div.weight}</span><span class="ufc-champ-tag"><i class="fa-solid fa-crown"></i> Champ: ${div.champion}</span></div><i class="fa-solid fa-chevron-down ufc-chevron"></i></div><div class="ufc-rankings-list"><div style="font-weight: 700; color: #60a5fa; margin-bottom: 6px;">Top 10 Contenders:</div>${div.rankings.map((fighter, idx) => `<div class="ufc-rank-row"><span class="rank-num">#${idx + 1}</span><span class="rank-name">${fighter}</span></div>`).join('')}</div></div>`).join('')}</div></div>`;
            } else if (config.standingsUrl) {
                topActionHtml = `<div class="top-action-bar" id="top-action-container"><button class="top-action-btn" onclick="toggleSubpage(true)"><i class="fa-solid fa-table-list"></i> View ${activeLeague} Standings</button></div>`;
                subpageHtml = `<div class="subpage-container" id="subpage-view"><div class="subpage-header"><span class="subpage-title"><i class="fa-solid fa-table-list"></i> ${activeLeague} Standings</span><button class="close-subpage-btn" onclick="toggleSubpage(false)">Back to Schedule</button></div><div class="standings-iframe-wrap"><iframe src="${config.standingsUrl}" loading="lazy"></iframe></div></div>`;
            }

            if (selectedConf === "ALL") {
                renderGames(currentGames, topActionHtml, subpageHtml);
            } else {
                const filtered = currentGames.filter(g => g.conferences.includes(selectedConf));
                renderGames(filtered, topActionHtml, subpageHtml);
            }
        }

        function renderGames(games, topActionHtml = "", subpageHtml = "") {
            const container = document.getElementById('game-list');
            container.className = "";
            
            let htmlContent = topActionHtml + subpageHtml + `<div id="list-content-container">`;
            if (!games.length) {
                htmlContent += "<p class='loading'>No games or categories scheduled for this view.</p>";
            } else {
                htmlContent += games.map(g => `
                    <div class="card">
                        <div class="card-main">
                            <div class="team away">
                                <div class="team-text-stack">
                                    <span class="team-city">${g.awayCity}</span>
                                    <span class="team-name">${g.awayTeam}</span>
                                </div>
                                <img src="${g.awayLogo}" alt="" onerror="this.style.display='none'">
                            </div>
                            <div class="info">
                                <div class="time">${g.displayTime}</div>
                                <div class="status ${g.statusState === 'in' ? 'live' : ''}">${g.statusDetail}</div>
                            </div>
                            <div class="team home">
                                <img src="${g.homeLogo}" alt="" onerror="this.style.display='none'">
                                <div class="team-text-stack">
                                    <span class="team-city">${g.homeCity}</span>
                                    <span class="team-name">${g.homeTeam}</span>
                                </div>
                            </div>
                        </div>
                        ${g.streamLinks && g.streamLinks.length > 0 ? `
                            <div class="stream-link-container">
                                ${g.streamLinks.map((link, idx) => `
                                    <a href="${link}" target="_blank" class="stream-btn">
                                        <i class="fa-solid fa-play"></i> Stream ${idx + 1}
                                    </a>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>
                `).join('');
            }
            htmlContent += `</div>`;

            container.innerHTML = htmlContent;
        }

        initApp();
    </script>
</body>
</html>
