<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sports Stream Hub</title>
    
    <!-- Mobile Web App Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="StreamHub">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 30px;
        }

        header {
            background-color: var(--card-bg);
            padding: 16px;
            text-align: center;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .category-bar {
            display: flex;
            overflow-x: auto;
            padding: 12px 16px;
            gap: 10px;
            background-color: var(--bg-color);
            scrollbar-width: none;
        }

        .category-bar::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid #334155;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
            cursor: pointer;
        }

        .cat-btn.active {
            background-color: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
        }

        .container {
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-right: 12px;
        }

        .card-title {
            font-weight: 600;
            font-size: 0.95rem;
            line-height: 1.3;
        }

        .card-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .watch-btn {
            background-color: var(--accent-color);
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .search-box {
            background-color: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 16px;
        }

        .search-box label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        .search-input {
            flex: 1;
            background-color: var(--bg-color);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            color: var(--text-color);
            font-size: 0.9rem;
        }

        .search-btn {
            background-color: #334155;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .main-btn {
            display: block;
            width: 100%;
            text-align: center;
            background-color: #334155;
            color: var(--text-color);
            text-decoration: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            margin-top: 16px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Sports Stream Hub</h1>
    </header>

    <div class="category-bar">
        <button class="cat-btn active" onclick="selectCategory('NFL', this)">NFL</button>
        <button class="cat-btn" onclick="selectCategory('CFB', this)">CFB</button>
        <button class="cat-btn" onclick="selectCategory('MLB', this)">MLB</button>
        <button class="cat-btn" onclick="selectCategory('MMA', this)">MMA/UFC</button>
        <button class="cat-btn" onclick="selectCategory('NBA', this)">NBA</button>
        <button class="cat-btn" onclick="selectCategory('Boxing', this)">Boxing</button>
    </div>

    <div class="container">
        <!-- Direct Matchup Search Box -->
        <div class="search-box">
            <label id="search-label">FIND SPECIFIC GAME</label>
            <div class="input-group">
                <input type="text" id="team-input" class="search-input" placeholder="e.g. Rams, Yankees, Cowboys...">
                <button onclick="searchGame()" class="search-btn">Go ➔</button>
            </div>
        </div>

        <div id="game-list">
            <!-- Game cards load here -->
        </div>

        <a id="main-hub-btn" href="https://mybuffstreams.plus/nflstreams2" target="_blank" class="main-btn">
            Open Main League Page ➔
        </a>
    </div>

    <script>
        // Exact active URLs pulled from site
        const scheduleData = {
            NFL: {
                mainUrl: "https://mybuffstreams.plus/nflstreams2",
                games: [
                    { 
                        title: "NFL Network", 
                        sub: "24/7 Channel • Live Stream", 
                        url: "https://mybuffstreams.plus/nflstreams2" 
                    },
                    { 
                        title: "Los Angeles Rams vs San Francisco 49ers", 
                        sub: "NFL Game • 12:35 AM", 
                        url: "https://mybuffstreams.plus/nflstreams2" 
                    }
                ]
            },
            CFB: {
                mainUrl: "https://mybuffstreams.plus/ncaastreams",
                games: [
                    { 
                        title: "NCAA College Football Hub", 
                        sub: "Active CFB Games & Feeds", 
                        url: "https://mybuffstreams.plus/ncaastreams" 
                    }
                ]
            },
            MLB: {
                mainUrl: "https://mybuffstreams.plus/mlb",
                games: [
                    { 
                        title: "New York Yankees vs Colorado Rockies", 
                        sub: "MLB • 11:05 PM ET", 
                        url: "https://mybuffstreams.plus/mlb" 
                    },
                    { 
                        title: "Chicago White Sox vs Pittsburgh Pirates", 
                        sub: "MLB • 11:40 PM ET", 
                        url: "https://mybuffstreams.plus/mlb" 
                    }
                ]
            },
            MMA: {
                mainUrl: "https://mybuffstreams.plus/mmastreams",
                games: [
                    { 
                        title: "UFC / MMA Stream Hub", 
                        sub: "Live Fight Night & Prelims Pass", 
                        url: "https://mybuffstreams.plus/mmastreams" 
                    }
                ]
            },
            NBA: {
                mainUrl: "https://mybuffstreams.plus/nbastreams",
                games: [
                    { 
                        title: "NBA Stream Hub", 
                        sub: "Main NBA Game Schedule Page", 
                        url: "https://mybuffstreams.plus/nbastreams" 
                    }
                ]
            },
            Boxing: {
                mainUrl: "https://mybuffstreams.plus/boxing",
                games: [
                    { 
                        title: "Boxing Events Hub", 
                        sub: "Main Card Streams Page", 
                        url: "https://mybuffstreams.plus/boxing" 
                    }
                ]
            }
        };

        let currentCat = 'NFL';

        function selectCategory(catKey, btnElement) {
            currentCat = catKey;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');

            const catData = scheduleData[catKey];
            const container = document.getElementById('game-list');
            const mainBtn = document.getElementById('main-hub-btn');

            document.getElementById('search-label').innerText = `FIND ${catKey} TEAM / MATCHUP`;
            mainBtn.href = catData.mainUrl;
            mainBtn.innerText = `Open All ${catKey} Streams ➔`;

            container.innerHTML = '';
            catData.games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-info">
                        <span class="card-title">${game.title}</span>
                        <span class="card-sub">${game.sub}</span>
                    </div>
                    <a href="${game.url}" target="_blank" class="watch-btn">Watch</a>
                `;
                container.appendChild(card);
            });
        }

        function searchGame() {
            const query = document.getElementById('team-input').value.trim();
            if (!query) return;
            // Generates a search target URL for buffstreams
            const searchUrl = `https://www.google.com/search?q=site:mybuffstreams.plus+${encodeURIComponent(query)}`;
            window.open(searchUrl, '_blank');
        }

        // Initialize default tab as NFL
        selectCategory('NFL', document.querySelector('.cat-btn'));
    </script>
</body>
</html>
