name: Auto Update Rankings

on:
  schedule:
    - cron: '0 8 * * 1' # Runs every Monday at 8:00 AM UTC
  workflow_dispatch: # Allows manual triggers from the Actions tab

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run scraping script
        run: |
          python update_rankings.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add rankings.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update rankings from Wikipedia" && git push)
